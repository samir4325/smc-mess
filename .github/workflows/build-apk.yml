name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/SMC_GEC_Palanpur.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMC_GEC_Palanpur_APK
          path: build-output/SMC_GEC_Palanpur.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-apk
          name: "SMC GEC Palanpur — Android APK (v1.0.0)"
          body: |
            ## 📱 SMC GEC Palanpur Android App
            
            Download the official Android APK for **Hostel Students Mess Committee (SMC), GEC Palanpur**.
            
            - **App Name**: SMC GEC Palanpur
            - **Package**: `com.smc.gecpalanpur`
            - **Connected Live**: Vercel Production (`https://smc-mess.vercel.app`) + Firebase Realtime DB
            
            ### 📥 Download Instructions:
            1. Download `SMC_GEC_Palanpur.apk` below directly on your Android phone.
            2. Tap the downloaded file to install.
            3. If prompted, allow "Install from Unknown Sources".
            4. Open the app and log in with your committee credentials!
          files: build-output/SMC_GEC_Palanpur.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
