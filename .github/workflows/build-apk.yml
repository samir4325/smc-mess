name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Gradle Wrapper
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../gradle_output.txt

      - name: Show Gradle Build Summary
        if: always()
        run: |
          echo "### Gradle Build Log Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 gradle_output.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Copy and Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/SMC_GEC_Palanpur.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMC_GEC_Palanpur_APK
          path: build-output/SMC_GEC_Palanpur.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "SMC GEC Palanpur — Android APK (v1.0.0)"
          body: |
            ## 📱 SMC GEC Palanpur Android App (Official)
            
            Download the official Android APK for **Hostel Students Mess Committee (SMC), Government Engineering College, Palanpur**.
            
            - **App Name**: SMC GEC Palanpur
            - **Package**: `com.smc.gecpalanpur`
            - **Connected Live**: Vercel Production (`https://smc-mess.vercel.app`) + Firebase Realtime DB
            
            ### 📥 Installation Steps:
            1. Download `SMC_GEC_Palanpur.apk` below directly onto your Android phone.
            2. Tap the file to install (Enable "Install unknown apps" if prompted).
            3. Open the app and log in!
          files: build-output/SMC_GEC_Palanpur.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
