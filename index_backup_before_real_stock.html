    // --- PAYMENTS VIEW (ADMIN-ONLY DISBURSAL, PERMISSION REMOVED FROM ACCOUNTANT) ---
    function PaymentsView({ role, currentUser, onUpdate }) {
      const [bills, setBills] = useState(() => ls_get('bills', []));
      const [payments, setPayments] = useState(() => ls_get('payments', []));
      const [payModalBill, setPayModalBill] = useState(null);
      const [amount, setAmount] = useState('');
      const [mode, setMode] = useState('UPI');
      const [refNo, setRefNo] = useState('');

      const handlePay = (e) => {
        e.preventDefault();
        const payId = getNextId('PAY');
        const payNum = Number(amount);

        const newPay = {
          id: payId,
          billId: payModalBill.id,
          purchaseId: payModalBill.purchaseId || 'PUR-GRP',
          vendorId: payModalBill.vendorId,
          vendorName: payModalBill.vendorName,
          amount: payNum,
          paymentDate: new Date().toISOString().slice(0, 10),
          paymentMode: mode,
          referenceNumber: refNo,
          paidBy: currentUser.name,
          createdAt: new Date().toISOString()
        };

        const updatedPayments = [...payments, newPay];
        ls_set('payments', updatedPayments);
        setPayments(updatedPayments);

        const totalPaidSoFar = updatedPayments.filter(p => p.billId === payModalBill.id).reduce((s, p) => s + Number(p.amount), 0);
        const rem = Number(payModalBill.billAmount) - totalPaidSoFar;
        const newStatus = rem <= 0 ? 'paid' : 'partially_paid';

        const updatedBills = bills.map(b => b.id === payModalBill.id ? { ...b, paymentStatus: newStatus } : b);
        ls_set('bills', updatedBills);
        setBills(updatedBills);

        showToast(`Payment ${payId} of ₹${payNum.toLocaleString()} processed!`, 'success');
        setPayModalBill(null);
        setAmount('');
        onUpdate();
      };

      return (
        <div className="space-y-4">
          <div className="flex justify-between items-center">
            <div>
              <h3 className="font-bold text-slate-800 text-sm">Disburse Vendor Payments (Super Admin Disbursal)</h3>
              <p className="text-xs text-slate-500">Pay verified invoices and record bank/UPI transaction references.</p>
            </div>
          </div>

          <div className="card overflow-x-auto">
            <table className="min-w-full divide-y divide-slate-200 text-xs">
              <thead>
                <tr>
                  <th className="table-th">Bill ID</th>
                  <th className="table-th">Vendor</th>
                  <th className="table-th">Bill Total</th>
                  <th className="table-th">Already Paid</th>
                  <th className="table-th">Remaining</th>
                  <th className="table-th">Verification</th>
                  <th className="table-th">Status</th>
                  <th className="table-th">Action</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {bills.map(b => {
                  const paid = payments.filter(p => p.billId === b.id).reduce((s, p) => s + Number(p.amount), 0);
                  const rem = Math.max(0, Number(b.billAmount) - paid);
                  return (
                    <tr key={b.id} className="hover:bg-slate-50">
                      <td className="table-td font-mono font-bold text-indigo-700">{b.id}</td>
                      <td className="table-td font-semibold text-slate-800">{b.vendorName || 'General Supplier'}</td>
                      <td className="table-td font-semibold">₹{Number(b.billAmount).toLocaleString()}</td>
                      <td className="table-td font-bold text-emerald-600">₹{paid.toLocaleString()}</td>
                      <td className="table-td font-bold text-red-600">₹{rem.toLocaleString()}</td>
                      <td className="table-td"><StatusBadge status={b.verificationStatus} /></td>
                      <td className="table-td"><StatusBadge status={rem <= 0 ? 'paid' : paid > 0 ? 'partially_paid' : 'pending'} /></td>
                      <td className="table-td">
                        {role === 'admin' && rem > 0 && (
                          <button onClick={() => { setPayModalBill(b); setAmount(rem); }} className="btn-primary text-xs py-1 px-2.5">
                            💳 Pay ₹{rem.toLocaleString()}
                          </button>
                        )}
                        {role !== 'admin' && rem > 0 && (
                          <span className="text-slate-400 italic text-[11px]">Admin Disbursal</span>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          {payModalBill && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <form onSubmit={handlePay} className="bg-white rounded-xl p-6 max-w-md w-full space-y-3 shadow-2xl">
                <h3 className="font-bold text-slate-800 text-sm">Process Payment for {payModalBill.id}</h3>
                <div>
                  <label className="form-label">Payment Amount (₹) *</label>
                  <input type="number" step="0.01" value={amount} onChange={e => setAmount(e.target.value)} className="form-input" required />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="form-label">Mode</label>
                    <select value={mode} onChange={e => setMode(e.target.value)} className="form-select">
                      {['UPI', 'NEFT', 'RTGS', 'Cash', 'Cheque', 'DD'].map(m => <option key={m}>{m}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="form-label">Reference No.</label>
                    <input type="text" value={refNo} onChange={e => setRefNo(e.target.value)} className="form-input font-mono" placeholder="UTR/Cheque No" />
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setPayModalBill(null)} className="btn-secondary text-xs">Cancel</button>
                  <button type="submit" className="btn-success text-xs">Confirm Payment</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    // --- USERS & COMMITTEE MEMBERS MANAGEMENT (WITH ADD, EDIT, DELETE) ---
    function UsersView({ onUpdate }) {
      const [users, setUsers] = useState(() => ls_get('users', []));
      const [modalUser, setModalUser] = useState(null);
      const [editUser, setEditUser] = useState(null);
      const [deleteUser, setDeleteUser] = useState(null);

      const handleAddUser = (e) => {
        e.preventDefault();
        const id = getNextId('USR');
        const u = { id, ...modalUser, role: modalUser.committee, isActive: true, password: modalUser.password || '123' };
        const updated = [...users, u];
        ls_set('users', updated);
        setUsers(updated);
        showToast(`Member ${u.name} added!`, 'success');
        setModalUser(null);
        onUpdate();
      };

      const handleSaveEdit = (e) => {
        e.preventDefault();
        const updated = users.map(u => u.id === editUser.id ? { 
          ...u, 
          name: editUser.name, 
          enrollmentNumber: editUser.enrollmentNumber, 
          committee: editUser.committee, 
          role: editUser.committee,
          password: editUser.password || u.password || '123'
        } : u);
        ls_set('users', updated);
        setUsers(updated);
        showToast(`Member ${editUser.name} updated!`, 'success');
        setEditUser(null);
        onUpdate();
      };

      const handleConfirmDelete = () => {
        if (!deleteUser) return;
        if (deleteUser.id === 'USR-001') {
          showToast('Cannot delete primary Super Admin account!', 'error');
          setDeleteUser(null);
          return;
        }
        const updated = users.filter(u => u.id !== deleteUser.id);
        ls_set('users', updated);
        setUsers(updated);
        showToast(`Member ${deleteUser.name} deleted!`, 'error');
        setDeleteUser(null);
        onUpdate();
      };

      return (
        <div className="space-y-4">
          <div className="flex justify-between items-center">
            <div>
              <h3 className="font-bold text-slate-800 text-sm">Committee Members & User Access</h3>
              <p className="text-xs text-slate-500">Super Admin can Add, Edit, and Delete committee members.</p>
            </div>
            <button onClick={() => setModalUser({ name: '', enrollmentNumber: '', committee: 'storage', password: '123' })} className="btn-primary text-xs">+ Add Member</button>
          </div>

          <div className="card overflow-x-auto">
            <table className="min-w-full divide-y divide-slate-200 text-xs">
              <thead>
                <tr>
                  <th className="table-th">ID</th>
                  <th className="table-th">Name</th>
                  <th className="table-th">Enrollment No.</th>
                  <th className="table-th">Committee</th>
                  <th className="table-th">Status</th>
                  <th className="table-th">Actions</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {users.map(u => (
                  <tr key={u.id} className="hover:bg-slate-50">
                    <td className="table-td font-mono font-bold text-slate-600">{u.id}</td>
                    <td className="table-td font-semibold text-slate-800">{u.name}</td>
                    <td className="table-td font-mono">{u.enrollmentNumber || 'ADMIN'}</td>
                    <td className="table-td uppercase font-semibold text-primary-700">{u.committee}</td>
                    <td className="table-td"><StatusBadge status={u.isActive ? 'active' : 'inactive'} /></td>
                    <td className="table-td">
                      {u.id !== 'USR-001' ? (
                        <div className="flex gap-2">
                          <button onClick={() => setEditUser(u)} className="inline-flex items-center gap-1 px-2 py-1 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded text-[11px] font-semibold">
                            ✏️ Edit
                          </button>
                          <button onClick={() => setDeleteUser(u)} className="inline-flex items-center gap-1 px-2 py-1 bg-red-50 hover:bg-red-100 text-red-700 rounded text-[11px] font-semibold">
                            🗑️ Delete
                          </button>
                        </div>
                      ) : (
                        <span className="text-slate-400 text-[11px] italic">Protected Admin</span>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Add User Modal */}
          {modalUser && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <form onSubmit={handleAddUser} className="bg-white rounded-xl p-6 max-w-sm w-full space-y-3 shadow-2xl">
                <h3 className="font-bold text-slate-800 text-sm">Add Committee Member</h3>
                <div>
                  <label className="form-label">Full Name *</label>
                  <input type="text" value={modalUser.name} onChange={e => setModalUser({ ...modalUser, name: e.target.value })} className="form-input" placeholder="e.g. Mayank Joshi" required />
                </div>
                <div>
                  <label className="form-label">Enrollment Number *</label>
                  <input type="text" value={modalUser.enrollmentNumber} onChange={e => setModalUser({ ...modalUser, enrollmentNumber: e.target.value })} className="form-input uppercase font-mono" placeholder="e.g. 21CE045" required />
                </div>
                <div>
                  <label className="form-label">Committee *</label>
                  <select value={modalUser.committee} onChange={e => setModalUser({ ...modalUser, committee: e.target.value })} className="form-select">
                    <option value="storage">Storage Committee</option>
                    <option value="procurement">Procurement Committee</option>
                    <option value="account">Account Committee</option>
                  </select>
                </div>
                <div>
                  <label className="form-label">PIN / Password (Default: 123)</label>
                  <input type="password" value={modalUser.password} onChange={e => setModalUser({ ...modalUser, password: e.target.value })} className="form-input" />
                </div>
                <div className="flex justify-end gap-2 pt-2 border-t">
                  <button type="button" onClick={() => setModalUser(null)} className="btn-secondary text-xs">Cancel</button>
                  <button type="submit" className="btn-primary text-xs">Save Member</button>
                </div>
              </form>
            </div>
          )}

          {/* Edit User Modal */}
          {editUser && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <form onSubmit={handleSaveEdit} className="bg-white rounded-xl p-6 max-w-sm w-full space-y-3 shadow-2xl">
                <h3 className="font-bold text-slate-800 text-sm">Edit Member — {editUser.id}</h3>
                <div>
                  <label className="form-label">Full Name *</label>
                  <input type="text" value={editUser.name} onChange={e => setEditUser({ ...editUser, name: e.target.value })} className="form-input" required />
                </div>
                <div>
                  <label className="form-label">Enrollment Number *</label>
                  <input type="text" value={editUser.enrollmentNumber} onChange={e => setEditUser({ ...editUser, enrollmentNumber: e.target.value })} className="form-input uppercase font-mono" required />
                </div>
                <div>
                  <label className="form-label">Committee *</label>
                  <select value={editUser.committee} onChange={e => setEditUser({ ...editUser, committee: e.target.value })} className="form-select">
                    <option value="storage">Storage Committee</option>
                    <option value="procurement">Procurement Committee</option>
                    <option value="account">Account Committee</option>
                  </select>
                </div>
                <div>
                  <label className="form-label">Password / PIN</label>
                  <input type="password" value={editUser.password || ''} onChange={e => setEditUser({ ...editUser, password: e.target.value })} className="form-input" placeholder="Change password..." />
                </div>
                <div className="flex justify-end gap-2 pt-2 border-t">
                  <button type="button" onClick={() => setEditUser(null)} className="btn-secondary text-xs">Cancel</button>
                  <button type="submit" className="btn-primary text-xs">Update Member</button>
                </div>
              </form>
            </div>
          )}

          {/* Delete User Confirmation */}
          {deleteUser && (
            <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl p-6 max-w-sm w-full space-y-3 shadow-2xl">
                <h3 className="font-bold text-red-600 text-sm flex items-center gap-1.5">
                  ⚠️ Delete Committee Member
                </h3>
                <p className="text-xs text-slate-600">
                  Are you sure you want to remove <strong>{deleteUser.name} ({deleteUser.enrollmentNumber})</strong> from {deleteUser.committee.toUpperCase()} Committee?
                </p>
                <div className="flex justify-end gap-2 pt-2 border-t">
                  <button onClick={() => setDeleteUser(null)} className="btn-secondary text-xs">Cancel</button>
                  <button onClick={handleConfirmDelete} className="btn-danger text-xs">Yes, Delete</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- REPORTS VIEW (WITH PRINT OPTION FOR ACCOUNTANT & ADMIN) ---
    function ReportsView({ role }) {
      const items = ls_get('items', []);
      const purchases = ls_get('purchases', []);
      const bills = ls_get('bills', []);

      return (
        <div className="card p-6 space-y-4">
          <div className="flex justify-between items-center no-print">
            <div>
              <h3 className="font-bold text-slate-800 text-sm">Export & Print Committee Reports</h3>
              <p className="text-xs text-slate-500">Download formatted Excel spreadsheets, PDF summaries, or print reports.</p>
            </div>
            {(role === 'account' || role === 'admin') && (
              <button onClick={() => window.print()} className="btn-primary text-xs bg-slate-800 hover:bg-slate-900">
                🖨️ Print Entire Report Sheet
              </button>
            )}
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">
            <div className="border border-slate-200 rounded-xl p-4 space-y-3 bg-slate-50">
              <p className="font-bold text-xs text-slate-800">📦 Inventory Stock Report</p>
              <button onClick={() => exportExcel(items, 'SMC_Stock_Report')} className="btn-primary w-full justify-center text-xs">Export Excel</button>
              <button onClick={() => exportPDF(['Item', 'Unit', 'Stock', 'Min Limit'], items.map(i => [i.name, i.unit, String(i.currentStock), String(i.minStockLimit)]), 'SMC GEC Palanpur — Stock Report', 'SMC_Stock')} className="btn-secondary w-full justify-center text-xs">Export PDF</button>
            </div>

            {role !== 'storage' && (
              <>
                <div className="border border-slate-200 rounded-xl p-4 space-y-3 bg-slate-50">
                  <p className="font-bold text-xs text-slate-800">🛒 Purchases Report</p>
                  <button onClick={() => exportExcel(purchases, 'SMC_Purchases_Report')} className="btn-primary w-full justify-center text-xs">Export Excel</button>
                  <button onClick={() => exportPDF(['Purchase ID', 'Vendor', 'Items', 'Status'], purchases.map(p => [p.id, p.vendorName || p.vendorId, normalizeItems(p).map(it => `${it.itemName} (${it.orderedQty} ${it.unit})`).join(', '), p.status]), 'SMC GEC Palanpur — Purchases Report', 'SMC_Purchases')} className="btn-secondary w-full justify-center text-xs">Export PDF</button>
                </div>

                <div className="border border-slate-200 rounded-xl p-4 space-y-3 bg-slate-50">
                  <p className="font-bold text-xs text-slate-800">💳 Payments & Bills Report</p>
                  <button onClick={() => exportExcel(bills, 'SMC_Bills_Report')} className="btn-primary w-full justify-center text-xs">Export Excel</button>
                  <button onClick={() => exportPDF(['Bill ID', 'Vendor', 'Bill No', 'Amount', 'Status'], bills.map(b => [b.id, b.vendorName || 'General', b.billNumber, `Rs. ${b.billAmount}`, b.verificationStatus]), 'SMC GEC Palanpur — Bills Report', 'SMC_Bills')} className="btn-secondary w-full justify-center text-xs">Export PDF</button>
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
