    const INITIAL_VENDORS = [];

    // Supported Units List
    const SUPPORTED_UNITS = ['kg', 'g', 'L', 'ml', 'Packet', 'Piece', 'Box', 'Bottle', 'Tin', 'Bag', 'Dozen', 'Other'];

    // --- REALTIME CLOUD DATABASE ENGINE ---
    let firebaseDb = null;

    function initCloud(onDataReceived) {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp({ databaseURL: HARDCODED_FIREBASE_URL });
        }
        firebaseDb = firebase.database();

        firebaseDb.ref('smc_master_db').on('value', (snap) => {
          const val = snap.val() || {};
          const allKeys = ['users','categories','items','vendors','requests','purchases','grns','stockIns','stockOuts','shortSupplies','bills','payments','activityLogs','trash','counters','procurements','gdrive_script_url'];
          allKeys.forEach(k => {
            let data = val[k];
            if (data === undefined || data === null) {
              data = (k === 'items' ? ACTUAL_HOSTEL_ITEMS : k === 'users' ? INITIAL_USERS : k === 'categories' ? INITIAL_CATEGORIES : k === 'vendors' ? INITIAL_VENDORS : k === 'gdrive_script_url' ? '' : []);
            }
            localStorage.setItem(PREFIX + k, JSON.stringify(data));
          });
          if (onDataReceived) onDataReceived();
        }, (err) => {
          console.warn('Firebase sync notice:', err);
        });
      } catch(e) {
        console.warn('Cloud init:', e);
      }
    }

    function syncEverythingToCloud() {
      if (!firebaseDb) return;
      try {
        const keys = ['users','categories','items','vendors','requests','purchases','grns','stockIns','stockOuts','shortSupplies','bills','payments','activityLogs','trash','counters','procurements','gdrive_script_url'];
        const fullDump = {};
        keys.forEach(k => {
          fullDump[k] = ls_get(k, k === 'users' ? INITIAL_USERS : k === 'items' ? ACTUAL_HOSTEL_ITEMS : k === 'vendors' ? INITIAL_VENDORS : k === 'categories' ? INITIAL_CATEGORIES : k === 'gdrive_script_url' ? '' : []);
        });
        firebaseDb.ref('smc_master_db').set(fullDump);
      } catch(e) {}
    }

    function syncKeyToCloud(key, value) {
      if (firebaseDb && key !== 'session') {
        try {
          firebaseDb.ref(`smc_master_db/${key}`).set(value);
        } catch(e) {}
      }
    }

    const PREFIX = 'smc_v8_clean_';
    function ls_get(key, fallback = null) {
      try {
        const v = localStorage.getItem(PREFIX + key);
        return v ? JSON.parse(v) : fallback;
      } catch { return fallback; }
    }
    function ls_set(key, val) {
      try {
        if (key !== 'session') {
          localStorage.setItem(PREFIX + key, JSON.stringify(val));
          syncKeyToCloud(key, val);
        }
      } catch(e) {}
    }

    // Helper: Normalize items list for multi-item support & backward compatibility
    // Items are always returned sorted A-Z by name for consistent display
    function normalizeItems(entity) {
      if (entity && Array.isArray(entity.items) && entity.items.length > 0) {
        return [...entity.items].sort((a, b) => (a.itemName || '').localeCompare(b.itemName || ''));
      }
      if (entity && entity.itemName) {
        return [{
          itemId: entity.itemId,
          itemName: entity.itemName,
          requiredQty: entity.requiredQty || entity.orderedQty || entity.qty,
          orderedQty: entity.orderedQty || entity.requiredQty || entity.qty,
          receivedQty: entity.receivedQty || 0,
          shortQty: entity.shortQty || 0,
          qty: entity.qty || entity.orderedQty || entity.requiredQty,
          unit: entity.unit || 'kg',
          packSize: entity.packSize || 'Not Specified',
          condition: entity.condition || 'Good'
        }];
      }
      return [];
    }

    // Session-only storage: Destroyed automatically when browser tab is closed
    function getSessionUser() {
      try {
        const s = sessionStorage.getItem('smc_auth_session');
        return s ? JSON.parse(s) : null;
      } catch { return null; }
    }
    function setSessionUser(u) {
      try {
        if (u) {
          sessionStorage.setItem('smc_auth_session', JSON.stringify(u));
        } else {
          sessionStorage.removeItem('smc_auth_session');
        }
      } catch(e) {}
    }

    // INITIALIZE & FORCE-CLEAN DUMMY TRANSACTIONS ACROSS ALL SESSIONS
    function initDb() {
      try {
        Object.keys(localStorage).forEach(k => {
          if (k.startsWith('smc_gec_live_v2_') || k.startsWith('smc_v5_') || k.startsWith('smc_v6_') || k.startsWith('smc_v7_')) {
            localStorage.removeItem(k);
          }
        });
      } catch(e) {}

      const FORCE_VERSION = 'v10_clean_requests';
      if (localStorage.getItem(PREFIX + 'db_clean_version') !== FORCE_VERSION) {
        localStorage.setItem(PREFIX + 'users', JSON.stringify(INITIAL_USERS));
        localStorage.setItem(PREFIX + 'categories', JSON.stringify(INITIAL_CATEGORIES));
        localStorage.setItem(PREFIX + 'items', JSON.stringify(ACTUAL_HOSTEL_ITEMS));
        localStorage.setItem(PREFIX + 'vendors', '[]');
        localStorage.setItem(PREFIX + 'requests', '[]');
        localStorage.setItem(PREFIX + 'purchases', '[]');
        localStorage.setItem(PREFIX + 'grns', '[]');
        localStorage.setItem(PREFIX + 'stockIns', '[]');
        localStorage.setItem(PREFIX + 'stockOuts', '[]');
        localStorage.setItem(PREFIX + 'shortSupplies', '[]');
        localStorage.setItem(PREFIX + 'bills', '[]');
        localStorage.setItem(PREFIX + 'payments', '[]');
        localStorage.setItem(PREFIX + 'activityLogs', '[]');
        localStorage.setItem(PREFIX + 'trash', '[]');
        localStorage.setItem(PREFIX + 'procurements', '[]');
        localStorage.setItem(PREFIX + 'counters', JSON.stringify({ REQ: 0, PUR: 0, GRN: 0, STKOUT: 0, SS: 0, BILL: 0, PAY: 0, ITEM: 68, CAT: 9, VEN: 0, USR: 7, PROC: 0, QTE: 0, ACT: 0 }));
        localStorage.setItem(PREFIX + 'db_clean_version', FORCE_VERSION);
      }
    }
    initDb();

    // --- GLOBAL ACTIVITY LOG ENGINE (ADMIN-ONLY ACCESSIBLE REPORT) ---
    function logActivity(action, section, relatedRecord = '', details = '', user = null) {
      try {
        const u = user || getSessionUser() || { name: 'System', role: 'system', committee: 'system' };
        const now = new Date();
        const dateStr = now.toISOString().slice(0, 10);
        const timeStr = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
        
        const logs = ls_get('activityLogs', []);
        const newEntry = {
          id: 'ACT-' + Date.now().toString().slice(-6),
          userName: u.name || 'User',
          userRole: u.role || 'member',
          committee: u.committee || u.role || 'general',
          action: action,
          section: section,
          relatedRecord: relatedRecord,
          details: details,
          date: dateStr,
          time: timeStr,
          timestamp: now.toISOString()
        };

        const updated = [newEntry, ...logs].slice(0, 1000);
        ls_set('activityLogs', updated);
      } catch(e) {
        console.warn('logActivity error:', e);
      }
    }

    // --- GLOBAL TRASH BIN ENGINE (SOFT-DELETE & RESTORE FOR ADMIN) ---
    function moveToTrash(originalCollection, record, title = '', user = null) {
      try {
        const u = user || getSessionUser() || { name: 'Admin', role: 'admin' };
        const now = new Date();
        const trashList = ls_get('trash', []);
        
        const trashItem = {
          id: 'TRASH-' + Date.now().toString().slice(-6),
          originalCollection: originalCollection,
          originalId: record.id || 'N/A',
          title: title || record.name || record.billNumber || record.id || 'Deleted Record',
          data: record,
          deletedBy: u.name || 'User',
          deletedByRole: u.role || 'user',
          deletedDate: now.toISOString().slice(0, 10),
          deletedTime: now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }),
          deletedAt: now.toISOString()
        };

        const updatedTrash = [trashItem, ...trashList];
        ls_set('trash', updatedTrash);
        
        logActivity('Moved to Trash (Deleted)', originalCollection.toUpperCase(), `${trashItem.title} (${trashItem.originalId})`, `Deleted by ${u.name}`);
        return trashItem;
      } catch(e) {
        console.warn('moveToTrash error:', e);
      }
    }

    function restoreFromTrash(trashId) {
      try {
        const trashList = ls_get('trash', []);
        const item = trashList.find(t => t.id === trashId);
        if (!item) return false;

        const collectionKey = item.originalCollection;
        const currentCollection = ls_get(collectionKey, []);
        
        const updatedCollection = [...currentCollection, item.data];
        ls_set(collectionKey, updatedCollection);

        const updatedTrash = trashList.filter(t => t.id !== trashId);
        ls_set('trash', updatedTrash);

        logActivity('Restored from Trash', item.originalCollection.toUpperCase(), `${item.title} (${item.originalId})`, `Restored to active data by Admin`);
        return true;
      } catch(e) {
        console.warn('restoreFromTrash error:', e);
        return false;
      }
    }

    function deleteFromTrashPermanently(trashId) {
      try {
        const trashList = ls_get('trash', []);
        const item = trashList.find(t => t.id === trashId);
        const updatedTrash = trashList.filter(t => t.id !== trashId);
        ls_set('trash', updatedTrash);
        if (item) {
          logActivity('Permanently Deleted from Trash', item.originalCollection.toUpperCase(), `${item.title} (${item.originalId})`, `Permanently purged from Trash`);
        }
        return true;
      } catch(e) {
        return false;
      }
    }

    function emptyTrash() {
      try {
        const trashList = ls_get('trash', []);
        const count = trashList.length;
        ls_set('trash', []);
        logActivity('Emptied Trash Bin', 'TRASH', `Purged ${count} records`, `Trash Bin emptied permanently by Admin`);
        return true;
      } catch(e) {
        return false;
      }
    }

    function showToast(msg, type = 'info') {
      const el = document.createElement('div');
      el.className = `fixed bottom-5 right-5 z-50 px-4 py-3 rounded-lg shadow-xl text-white font-medium text-sm flex items-center gap-2 transform transition-all duration-300 ${
        type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-600' : type === 'warning' ? 'bg-amber-600' : 'bg-blue-600'
      }`;
      el.innerHTML = `<span>${type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ'}</span> <span>${msg}</span>`;
      document.body.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3500);
    }

    function exportExcel(data, filename) {
      if (!data || data.length === 0) { showToast('No data to export', 'warning'); return; }
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
      const fullFileName = `${filename}_${new Date().toISOString().slice(0,10)}.xlsx`;

      // Check if running inside SMC Android App Native WebView
      if (window.AndroidBridge && typeof window.AndroidBridge.saveBase64File === 'function') {
        try {
          const b64 = XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });
          window.AndroidBridge.saveBase64File(b64, fullFileName, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
          showToast('Excel report downloaded to device!', 'success');
          return;
        } catch (err) {
          console.warn('AndroidBridge Excel export fallback:', err);
        }
      }

      XLSX.writeFile(wb, fullFileName);
      showToast('Excel report downloaded!', 'success');
    }

    function exportPDF(headers, rows, title, filename) {
      if (!rows || rows.length === 0) { showToast('No data to export', 'warning'); return; }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape' });
      doc.setFontSize(14);
      doc.text(title, 14, 15);
      doc.setFontSize(9);
      doc.text(`Generated on: ${new Date().toLocaleString()}`, 14, 22);
      doc.autoTable({
        head: [headers],
        body: rows,
        startY: 28,
        headStyles: { fillColor: [37, 99, 235] },
        styles: { fontSize: 8 }
      });
      const fullFileName = `${filename}_${new Date().toISOString().slice(0,10)}.pdf`;

      // Check if running inside SMC Android App Native WebView
      if (window.AndroidBridge && typeof window.AndroidBridge.saveBase64File === 'function') {
        try {
          const dataUri = doc.output('datauristring');
          const b64 = dataUri.split(',')[1] || '';
          if (b64) {
            window.AndroidBridge.saveBase64File(b64, fullFileName, 'application/pdf');
            showToast('PDF report downloaded to device!', 'success');
            return;
          }
        } catch (err) {
          console.warn('AndroidBridge PDF export fallback:', err);
        }
      }

      doc.save(fullFileName);
      showToast('PDF report downloaded!', 'success');
    }

    function getNextId(prefix) {
      const counters = ls_get('counters') || {};
      const next = (counters[prefix] || 0) + 1;
      counters[prefix] = next;
      ls_set('counters', counters);
      return `${prefix}-${String(next).padStart(3, '0')}`;
    }

        { id: 'insights', label: 'Insights & Reports', icon: '🔗', items: [{ id: 'trace', label: 'Transaction Trace', icon: '🔗' }, { id: 'reports', label: 'Reports & Export', icon: '📑' }] },
        { id: 'admin', label: 'Administration', icon: '⚙️', items: [{ id: 'users', label: 'Manage Members', icon: '👥' }, { id: 'activitylogs', label: 'Activity Log', icon: '📜' }, { id: 'trash', label: 'Trash Bin', icon: '🗑️' }] },

              <div className="min-w-0">
                <p className="text-white font-bold text-xs truncate">Super Admin Panel</p>
                <p className="text-slate-400 text-[10px] truncate">GEC Palanpur · SMC</p>
              </div>
            </div>
          </div>

          {/* Groups */}
          <nav className="flex-1 overflow-y-auto py-3 px-2 space-y-0.5">
            {groups.map(group => (

                  onClick={() => setOpenGroup(o => o === group.id ? null : group.id)}
                  className="w-full flex items-center justify-between px-3 py-2 text-left rounded-lg text-slate-300 hover:bg-slate-700/60 active:bg-slate-700 transition-colors"
                >
                  <div className="flex items-center gap-2 min-w-0">
                    <span className="text-sm shrink-0">{group.icon}</span>
                    <span className="text-[11px] font-bold uppercase tracking-widest text-slate-400 truncate">{group.label}</span>

                  <svg className={`w-3.5 h-3.5 shrink-0 text-slate-500 transition-transform duration-200 ${openGroup === group.id ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M19 9l-7 7-7-7"/></svg>
                </button>

                <div className={`overflow-hidden transition-all duration-200 ${openGroup === group.id ? 'max-h-96 opacity-100' : 'max-h-0 opacity-0'}`}>
                  <div className="mt-0.5 space-y-0.5 pl-2 pb-1">
                    {group.items.map(item => (
                      <button
                        key={item.id}
                        onClick={() => { navigate(item.id); if (onItemClick) onItemClick(); }}
                        className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-medium transition-all text-left ${
                          isViewActive(item.id)

                      >
                        <span className="text-sm shrink-0">{item.icon}</span>
                        <span className="text-xs truncate">{item.label}</span>
                        {item.id === 'approvals' && (() => {
                          const count = ls_get('stockOuts', []).filter(s => s.status === 'pending_approval' || s.requiresAdminApproval).length;
                          return count > 0 ? <span className="ml-auto shrink-0 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">{count}</span> : null;
                        })()}

      return (
        <>

          <aside className="hidden lg:flex flex-col w-56 xl:w-64 shrink-0 bg-slate-900 border-r border-slate-800 overflow-hidden">
            <SidebarContent />
          </aside>

          {/* MOBILE SLIDE-OVER SIDEBAR */}
          <aside
            className={`lg:hidden fixed top-0 left-0 z-40 h-full w-64 max-w-[85vw] bg-slate-900 border-r border-slate-800 flex flex-col transform transition-transform duration-300 ease-in-out`}
            style={{transform: mobileSidebarOpen ? 'translateX(0)' : 'translateX(-100%)'}}
          >
            {/* Close button row */}
            <div className="flex items-center justify-between px-4 py-3 border-b border-slate-700/50 shrink-0">
              <span className="text-white font-bold text-sm">Admin Navigation</span>
              <button onClick={onMobileClose} className="p-1.5 rounded-lg text-slate-400 hover:bg-slate-700 hover:text-white transition-colors active:bg-slate-600">
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>
            <SidebarContent onItemClick={onMobileClose} />
          </aside>
        </>
      );
    }

    // --- DASHBOARD VIEW ---
    function DashboardView({ role, currentUser, setView }) {
      const items = ls_get('items', []);
      const purchases = ls_get('purchases', []);
      const bills = ls_get('bills', []);
      const payments = ls_get('payments', []);
      const requests = ls_get('requests', []);

      const lowStock = items.filter(i => i.currentStock > 0 && i.currentStock <= i.minStockLimit).length;
      const outOfStock = items.filter(i => i.currentStock <= 0).length;

      const totalBilled = bills.reduce((s, b) => s + Number(b.billAmount || 0), 0);
      const totalPaid = payments.reduce((s, p) => s + Number(p.amount || 0), 0);
      const totalPending = Math.max(0, totalBilled - totalPaid);

      const handleExportRequestsPDF = () => {
        if (!requests || requests.length === 0) {
          showToast('No requests to export', 'warning');
          return;
        }
        const headers = ['Request ID', 'Items (Quantity)', 'Priority', 'Status', 'Date', 'Requested By'];
        const rows = requests.map(r => {
          const norm = normalizeItems(r);
          const itemsStr = norm.map(it => `${it.itemName}: ${it.requiredQty} ${it.unit}`).join('\n');
          return [
            r.id,
            itemsStr,
            r.priority || 'Normal',
            (r.status || 'pending').toUpperCase(),
            r.requestDate || r.date || '—',
            r.requestedBy || 'Storage Committee'
          ];
        });
        exportPDF(headers, rows, 'SMC GEC Palanpur — Storage Procurement Requests Report', 'SMC_Storage_Requests');
      };

      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-primary-700 to-indigo-800 rounded-2xl p-6 text-white shadow-lg flex flex-wrap justify-between items-center gap-4">
            <div>
              <h2 className="text-xl font-bold">Welcome, {currentUser.name}!</h2>
              <p className="text-primary-100 text-xs mt-1">Hostel Students Mess Committee · {role.toUpperCase()} Workspace</p>
            </div>
            <div className="flex flex-wrap gap-2">
              {role === 'storage' && (
                <>
                  <button onClick={() => setView('requests')} className="btn-primary bg-white text-primary-800 hover:bg-primary-50 text-xs font-semibold">+ New Grouped Request</button>
                  <button onClick={() => setView('grn')} className="btn-primary bg-white/20 text-white hover:bg-white/30 text-xs font-semibold">🚚 Create GRN</button>
                </>
              )}
              {role === 'procurement' && (
                <>
                  <button onClick={handleExportRequestsPDF} className="btn-primary bg-white/20 text-white hover:bg-white/30 text-xs font-semibold flex items-center gap-1.5">
                    📄 Export Requests PDF
                  </button>
                  <button onClick={() => setView('bills')} className="btn-primary bg-white text-primary-800 hover:bg-primary-50 text-xs font-semibold">📁 Upload Bill File</button>
                </>
              )}
              {role === 'account' && <button onClick={() => setView('bills')} className="btn-primary bg-white text-primary-800 hover:bg-primary-50 text-xs font-semibold">🛡️ Verify Bills & Print</button>}
              {role === 'admin' && <button onClick={() => setView('payments')} className="btn-primary bg-white text-primary-800 hover:bg-primary-50 text-xs font-semibold">💳 Disburse Payments</button>}
            </div>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <StatCard title="Total Stock Items" value={items.length} icon="📦" color="blue" />
            <StatCard title="Low Stock Items" value={lowStock} icon="🟡" color="amber" subtitle="Restock required" />
            <StatCard title="Out of Stock" value={outOfStock} icon="🔴" color="red" subtitle="Critical shortage" />
            <StatCard title="Pending Requests" value={requests.filter(r => r.status === 'pending').length} icon="📝" color="indigo" />

            {role !== 'storage' && (
              <>
                <StatCard title="Total Purchases" value={purchases.length} icon="🛒" color="purple" />
                <StatCard title="Uploaded Bills" value={bills.length} icon="🧾" color="blue" />
                <StatCard title="Total Paid" value={`₹${totalPaid.toLocaleString()}`} icon="💳" color="green" />
                <StatCard title="Pending Payments" value={`₹${totalPending.toLocaleString()}`} icon="⏳" color="red" />
              </>
            )}
          </div>
        </div>
      );
    }

    function StatCard({ title, value, icon, color, subtitle }) {
      return (
        <div className="card p-4 flex items-start gap-3">
          <div className="text-2xl">{icon}</div>
          <div className="flex-1 min-w-0">
            <p className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">{title}</p>
            <p className="text-xl font-bold text-slate-800 mt-0.5 truncate">{value}</p>
            {subtitle && <p className="text-[10px] text-slate-400 mt-0.5">{subtitle}</p>}
          </div>
        </div>
      );
    }

    // --- STOCK & ITEMS VIEW (WITH UPPER LIMIT, PACK SIZE, FLEXIBLE UNITS & TRASH INTEGRATION) ---
    function ItemsView({ role, onUpdate }) {
      const [items, setItems] = useState(() => ls_get('items', []));
      const [categories] = useState(() => ls_get('categories', []));
      const [search, setSearch] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('ALL');
      const [modalItem, setModalItem] = useState(null);
      const [editItemModal, setEditItemModal] = useState(null);

      const categoryMap = useMemo(() => {
        const m = {};
        categories.forEach(c => { m[c.id] = c.name; });
        return m;
      }, [categories]);

      const filtered = items.filter(i => {
        const matchesSearch = i.name.toLowerCase().includes(search.toLowerCase()) || 
                              (i.brand && i.brand.toLowerCase().includes(search.toLowerCase()));
        const matchesCat = categoryFilter === 'ALL' || i.categoryId === categoryFilter;
        return matchesSearch && matchesCat;
      });

      const handleSaveEdit = (e) => {
        e.preventDefault();
        const upperLimitNum = editItemModal.upperLimit ? Number(editItemModal.upperLimit) : 0;
        const updated = items.map(i => i.id === editItemModal.id ? { 
          ...i, 
          name: editItemModal.name,
          brand: editItemModal.brand || 'Not Specified',
          categoryId: editItemModal.categoryId,
          unit: editItemModal.unit,
          packSize: editItemModal.packSize || 'Not Specified',
          currentStock: Number(editItemModal.currentStock),
          minStockLimit: Number(editItemModal.minStockLimit),
          upperLimit: upperLimitNum,
          remarks: editItemModal.remarks || ''
        } : i);
        ls_set('items', updated);
        setItems(updated);
        logActivity('Edited Stock Item', 'STORAGE', `${editItemModal.name} (${editItemModal.id})`, `Stock: ${editItemModal.currentStock} ${editItemModal.unit}, Upper Limit: ${upperLimitNum > 0 ? upperLimitNum + ' ' + editItemModal.unit : 'None'}`);
        showToast(`Item ${editItemModal.name} updated successfully!`, 'success');
        setEditItemModal(null);
        onUpdate();
      };

      const handleAddItem = (e) => {
        e.preventDefault();
        const id = getNextId('ITEM');
        const upperLimitNum = modalItem.upperLimit ? Number(modalItem.upperLimit) : 0;
        const newItem = { 
          id, 
          ...modalItem, 
          brand: modalItem.brand || 'Not Specified',
          packSize: modalItem.packSize || 'Not Specified',
          currentStock: Number(modalItem.currentStock || 0), 
          minStockLimit: Number(modalItem.minStockLimit || 0),
          upperLimit: upperLimitNum
        };
        const updated = [...items, newItem];
        ls_set('items', updated);
        setItems(updated);
        logActivity('Added Stock Item', 'STORAGE', `${newItem.name} (${newItem.id})`, `Initial stock: ${newItem.currentStock} ${newItem.unit}, Upper Limit: ${upperLimitNum > 0 ? upperLimitNum + ' ' + newItem.unit : 'None'}`);
        showToast(`Item ${newItem.name} added successfully!`, 'success');
        setModalItem(null);
        onUpdate();
      };

      const handleDeleteItem = (itemToDelete) => {
        if (!confirm(`Move "${itemToDelete.name}" to Trash Bin? (Super Admin can restore it anytime)`)) return;
        moveToTrash('items', itemToDelete, `Stock Item: ${itemToDelete.name} (${itemToDelete.currentStock} ${itemToDelete.unit})`);
        const updated = items.filter(i => i.id !== itemToDelete.id);
        ls_set('items', updated);
        setItems(updated);
        showToast(`Item "${itemToDelete.name}" moved to Trash Bin!`, 'error');
        onUpdate();
      };

      return (
        <div className="space-y-4">
          <div className="flex flex-wrap justify-between items-center gap-3">
            <div className="flex flex-wrap items-center gap-2 flex-1">
              <input 
                type="text" 
                value={search} 
                onChange={e => setSearch(e.target.value)} 
                placeholder="Search item or brand..." 
                className="form-input max-w-xs text-xs" 
              />
              <select 
                value={categoryFilter} 
                onChange={e => setCategoryFilter(e.target.value)} 
                className="form-select text-xs w-auto"
              >
                <option value="ALL">All Categories ({items.length})</option>
                {categories.map(c => (
                  <option key={c.id} value={c.id}>{c.name}</option>
                ))}
              </select>
            </div>
            <div className="flex gap-2">
              <button onClick={() => exportExcel(items, 'SMC_Hostel_Stock_Inventory')} className="btn-secondary text-xs">📊 Export Excel</button>
              {(role === 'storage' || role === 'admin') && (
                <button onClick={() => setModalItem({ name: '', brand: '', categoryId: 'CAT-001', unit: 'kg', packSize: 'Not Specified', currentStock: 0, minStockLimit: 10, upperLimit: '', remarks: '' })} className="btn-primary text-xs">+ Add New Item</button>
              )}
            </div>
          </div>

          <div className="card overflow-x-auto">
            <table className="min-w-full divide-y divide-slate-200 text-xs">
              <thead>
                <tr>
                  <th className="table-th">Item Name</th>
                  <th className="table-th">Brand</th>
                  <th className="table-th">Category</th>
                  <th className="table-th">Current Stock</th>
                  <th className="table-th">Unit</th>
                  <th className="table-th">Pack Size</th>
                  <th className="table-th">Min Limit</th>
                  <th className="table-th">Stock Out Upper Limit</th>
                  <th className="table-th">Status</th>
                  <th className="table-th">Actions</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {filtered.map(i => {
                  const status = i.currentStock <= 0 ? 'out_of_stock' : i.currentStock <= i.minStockLimit ? 'low_stock' : 'in_stock';
                  return (
                    <tr key={i.id} className="hover:bg-slate-50">
                      <td className="table-td font-semibold text-slate-800">
                        {i.name}
                        {i.remarks && <div className="text-[10px] text-slate-400 mt-0.5">{i.remarks}</div>}
                      </td>
                      <td className="table-td text-slate-600 font-medium">{i.brand || 'Not Specified'}</td>
                      <td className="table-td text-slate-500">{categoryMap[i.categoryId] || i.categoryId}</td>
                      <td className="table-td font-bold text-slate-900">{i.currentStock} {i.unit}</td>
                      <td className="table-td font-semibold text-primary-700">{i.unit}</td>
                      <td className="table-td text-slate-600">
                        {i.packSize && i.packSize !== 'Not Specified' ? (
                          <span className="badge bg-slate-100 text-slate-800 font-medium">{i.packSize}</span>
                        ) : (
                          <span className="text-slate-400 italic">Not Specified</span>
                        )}
                      </td>
                      <td className="table-td text-slate-500">{i.minStockLimit} {i.unit}</td>
                      <td className="table-td">
                        {i.upperLimit && Number(i.upperLimit) > 0 ? (
                          <span className="badge bg-amber-50 text-amber-800 border border-amber-200 font-semibold" title="Stock Out exceeding this requires Admin approval">
                            🛡️ {i.upperLimit} {i.unit}
                          </span>
                        ) : (
                          <span className="text-slate-400 italic">No Upper Limit</span>
                        )}
                      </td>
                      <td className="table-td"><StatusBadge status={status} /></td>
                      <td className="table-td">
                        <div className="flex items-center gap-2">
                          <button onClick={() => setEditItemModal(i)} className="text-primary-600 font-semibold hover:underline">
                            ✏️ Edit
                          </button>
                          {(role === 'admin' || role === 'storage') && (
                            <button onClick={() => handleDeleteItem(i)} className="text-red-600 font-semibold hover:underline" title="Move to Trash Bin">
                              🗑️ Delete
                            </button>
                          )}
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          {/* Edit Item Modal */}
          {editItemModal && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <form onSubmit={handleSaveEdit} className="bg-white rounded-xl p-6 max-w-md w-full space-y-3 shadow-2xl">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-slate-800 text-sm">Edit Item — {editItemModal.id}</h3>
                  <button type="button" onClick={() => setEditItemModal(null)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>
