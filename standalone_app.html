                <thead className="bg-slate-50">
                  <tr>
                    <th className="table-th">ID</th>
                    <th className="table-th">Title / Description</th>
                    <th className="table-th">Items</th>
                    <th className="table-th">Stage Progress</th>
                    <th className="table-th">Status</th>
                    <th className="table-th">Created By</th>
                    <th className="table-th">Date</th>
                    <th className="table-th">Actions</th>

                      <p className="font-semibold text-slate-600">No procurements found.</p>
                      <p className="text-[11px]">Create a new procurement to start the workflow.</p>

                        <tr key={proc.id} onClick={() => onOpenDetail(proc.id)} className="hover:bg-slate-50 cursor-pointer transition-colors">
                          <td className="table-td font-mono font-bold text-violet-700">{proc.id}</td>
                          <td className="table-td">

                          </td>
                          <td className="table-td">
                            <div className="space-y-0.5">
                              {(proc.items || []).slice(0, 2).map((it, i) => (
                                <div key={i} className="text-[11px] text-slate-600">• {it.itemName} ({it.estimatedQty} {it.unit})</div>

                              {(proc.items || []).length > 2 && <div className="text-[11px] text-slate-400">+{proc.items.length - 2} more</div>}

                          <td className="table-td">

                                <span>{pct}%</span>

                          <td className="table-td">
                            <button onClick={e => { e.stopPropagation(); onOpenDetail(proc.id); }} className="btn-primary text-xs py-1 px-3">
                              Open →
                            </button>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </div>

          {/* Create New Procurement Modal */}
          {showNewModal && (
            <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
              <form onSubmit={handleCreateProc} className="bg-white rounded-2xl p-6 max-w-lg w-full space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-slate-800">Create New Procurement</h3>
                  <button type="button" onClick={() => setShowNewModal(false)} className="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
                </div>

                <div>
                  <label className="form-label">Procurement Title *</label>
                  <input type="text" value={newProc.title} onChange={e => setNewProc(p => ({...p, title: e.target.value}))} className="form-input" placeholder="e.g. Monthly Grocery Purchase — October 2026" required />
                </div>
                <div>
                  <label className="form-label">Description / Notes</label>
                  <textarea value={newProc.description} onChange={e => setNewProc(p => ({...p, description: e.target.value}))} className="form-input h-16 text-xs" placeholder="Brief description of procurement requirements..." />
                </div>

                <div>
                  <div className="flex justify-between items-center mb-2">

                    <button type="button" onClick={handleAddItemRow} className="text-primary-600 hover:text-primary-700 text-xs font-bold">+ Add Item</button>

                        <select value={item.unit} onChange={e => setNewProc(p => ({...p, items: p.items.map((it,idx) => idx===i ? {...it, unit: e.target.value} : it)}))} className="form-select text-xs w-20">
                          {SUPPORTED_UNITS.map(u => <option key={u} value={u}>{u}</option>)}

            </div>
          )}
        </div>
      );

    // ===========================================================
    // PROCUREMENT MODULE — DETAIL / WORKFLOW VIEW
    // ===========================================================
    function ProcurementDetailView({ currentUser, procurementId, onUpdate, onBack }) {
      const [proc, setProc] = useState(() => (ls_get('procurements', [])).find(p => p.id === procurementId) || null);
      const vendors = ls_get('vendors', []);

      if (!proc) {
        return (
          <div className="card p-8 text-center">
            <div className="text-4xl mb-3">🔍</div>
            <p className="font-semibold text-slate-700">Procurement not found.</p>
            <button onClick={onBack} className="btn-secondary text-xs mt-4">← Back to List</button>
          </div>
        );
      }

      const saveProc = (updatedProc) => {
        const all = ls_get('procurements', []);
        const updated = all.map(p => p.id === updatedProc.id ? updatedProc : p);
        ls_set('procurements', updated);
        setProc(updatedProc);
        onUpdate();
      };

      const advanceToStage = (newStatus, stagePatch = {}, note = '') => {
        const now = new Date();
        const updated = {
          ...proc,
          ...stagePatch,
          status: newStatus,
          history: [...(proc.history || []), { stage: newStatus, by: currentUser.name, at: now.toISOString(), note }]
        };
        saveProc(updated);
        logActivity(`Advanced Procurement to ${newStatus}`, 'PROCUREMENT', `${proc.id} — ${proc.title}`, note || `Stage: ${newStatus}`);
        showToast(`Stage advanced to "${PROC_STEPS.find(s=>s.key===newStatus)?.label || newStatus}"!`, 'success');
      };

      const stepIdx = procStepIndex(proc.status);
      const totalSteps = PROC_STEP_ORDER.length;

      // ---- Stage Panels ----
      const [mrNotes, setMrNotes] = useState(proc.marketResearchNotes || '');
      const [mrDate, setMrDate] = useState(proc.marketResearchDate || new Date().toISOString().slice(0, 10));

      const [rfqVendors, setRfqVendors] = useState(proc.rfqSentTo || []);
      const [rfqDate, setRfqDate] = useState(proc.rfqDate || new Date().toISOString().slice(0, 10));
      const [rfqNotes, setRfqNotes] = useState(proc.rfqNotes || '');

      const [showAddQuote, setShowAddQuote] = useState(false);
      const [newQuote, setNewQuote] = useState({ vendorId: '', quoteDate: new Date().toISOString().slice(0, 10), totalAmount: '', notes: '', items: [{ itemName: proc.items?.[0]?.itemName || '', unit: proc.items?.[0]?.unit || 'kg', qty: '', rate: '', total: '' }], docBase64: '', docName: '' });

      const [compNotes, setCompNotes] = useState(proc.comparativeNotes || '');

      const [selVendorId, setSelVendorId] = useState(proc.selectedVendorId || '');
      const [selReason, setSelReason] = useState(proc.selectionReason || '');

      const [negNotes, setNegNotes] = useState(proc.negotiationNotes || '');
      const [negAmount, setNegAmount] = useState(proc.finalNegotiatedAmount || '');
      const [negDate, setNegDate] = useState(proc.negotiationDate || new Date().toISOString().slice(0, 10));

      const [contractNum, setContractNum] = useState(proc.contractNumber || '');
      const [contractStart, setContractStart] = useState(proc.contractStartDate || new Date().toISOString().slice(0, 10));
      const [contractEnd, setContractEnd] = useState(proc.contractEndDate || (() => { const d = new Date(); d.setMonth(d.getMonth()+3); return d.toISOString().slice(0,10); })());
      const [contractTerms, setContractTerms] = useState(proc.contractTerms || '');
      const [contractDocBase64, setContractDocBase64] = useState(proc.contractDocBase64 || '');
      const [contractDocName, setContractDocName] = useState(proc.contractDocName || '');

      const [compDate, setCompDate] = useState(proc.completedDate || new Date().toISOString().slice(0, 10));
      const [compNotes2, setCompNotes2] = useState(proc.completionNotes || '');

      const handleQuoteFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          setNewQuote(q => ({ ...q, docBase64: ev.target.result, docName: file.name }));
          showToast('Quote document loaded!', 'info');
        };
        reader.readAsDataURL(file);
      };

      const handleContractFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          setContractDocBase64(ev.target.result);
          setContractDocName(file.name);
          showToast('Contract document loaded!', 'info');
        };
        reader.readAsDataURL(file);
      };

      const handleAddQuote = (e) => {
        e.preventDefault();
        const vendor = vendors.find(v => v.id === newQuote.vendorId);
        if (!vendor) { showToast('Please select a vendor.', 'error'); return; }
        const qid = getNextId('QTE');
        const quote = { ...newQuote, id: qid, vendorName: vendor.name, addedBy: currentUser.name, addedAt: new Date().toISOString() };
        const updatedQuotes = [...(proc.quotations || []), quote];
        const updatedStatus = proc.status === 'rfq_sent' || proc.status === 'market_research' ? 'quotations_received' : proc.status;
        const updated = { ...proc, quotations: updatedQuotes, status: updatedStatus };
        saveProc(updated);
        logActivity('Added Vendor Quotation', 'PROCUREMENT', `${proc.id} — ${vendor.name}`, `Amount: ₹${newQuote.totalAmount}`);
        showToast(`Quotation from ${vendor.name} added!`, 'success');
        setShowAddQuote(false);
        setNewQuote({ vendorId: '', quoteDate: new Date().toISOString().slice(0, 10), totalAmount: '', notes: '', items: [{ itemName: '', unit: 'kg', qty: '', rate: '', total: '' }], docBase64: '', docName: '' });
      };

      const renderStepIndicator = () => (
        <div className="card p-4 mb-6 overflow-x-auto">
          <div className="flex items-center gap-0 min-w-max">
            {PROC_STEPS.map((step, i) => {
              const done = i < stepIdx;
              const current = i === stepIdx;
              const future = i > stepIdx;
              return (
                <div key={step.key} className="flex items-center">
                  <div className="flex flex-col items-center gap-1">
                    <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold border-2 transition-all ${done ? 'bg-emerald-500 border-emerald-500 text-white' : current ? 'bg-violet-600 border-violet-600 text-white' : 'bg-slate-100 border-slate-200 text-slate-400'}`}>
                      {done ? '✓' : step.icon}
                    </div>
                    <span className={`text-[9px] font-semibold whitespace-nowrap max-w-16 text-center leading-tight ${current ? 'text-violet-700' : done ? 'text-emerald-700' : 'text-slate-400'}`}>{step.label}</span>
                  </div>
                  {i < PROC_STEPS.length - 1 && (
                    <div className={`w-8 h-0.5 mx-0.5 mb-5 ${i < stepIdx ? 'bg-emerald-400' : 'bg-slate-200'}`}></div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );

      return (
        <div className="space-y-6">
          {/* Header */}
          <div className="flex items-center justify-between flex-wrap gap-3">
            <div className="flex items-center gap-3">
              <button onClick={onBack} className="btn-secondary text-xs px-3 py-1.5">← Back</button>
              <div>
                <div className="flex items-center gap-2">
                  <h2 className="font-bold text-slate-800 text-base">{proc.title}</h2>
                  <StatusBadge status={proc.status} />
                </div>
                <p className="text-xs text-slate-400 font-mono mt-0.5">{proc.id} · Created by {proc.createdBy} on {proc.date}</p>
              </div>
            </div>
            {proc.status !== 'cancelled' && proc.status !== 'procurement_completed' && (
              <button onClick={() => { if (confirm('Cancel this procurement?')) { advanceToStage('cancelled', {}, 'Cancelled by Admin/Procurement'); } }} className="btn-secondary text-xs text-red-600 hover:bg-red-50 hover:border-red-200">✕ Cancel Procurement</button>

          </div>

          {/* Step Indicator */}
          {renderStepIndicator()}

          {/* Items Summary Card */}
          <div className="card p-4">
            <div className="flex justify-between items-center mb-3">

                <thead><tr><th className="table-th">Item Name</th><th className="table-th">Qty Required</th><th className="table-th">Unit</th></tr></thead>
                <tbody className="divide-y divide-slate-50">
                  {(proc.items || []).map((it, i) => (
                    <tr key={i}><td className="table-td font-semibold">{it.itemName}</td><td className="table-td">{it.estimatedQty}</td><td className="table-td">{it.unit}</td></tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* ====== STAGE 1: Market Research ====== */}
          <div className={`card p-5 space-y-4 ${stepIdx >= 0 ? '' : 'opacity-50 pointer-events-none'}`}>

              <h3 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${stepIdx > 0 ? 'bg-emerald-100 text-emerald-700' : 'bg-sky-100 text-sky-700'}`}>{stepIdx > 0 ? '✓' : '1'}</span>

              </h3>
              {stepIdx > 0 && <span className="badge bg-emerald-100 text-emerald-700">✓ Done</span>}
            </div>
            <div className="grid sm:grid-cols-2 gap-3">
              <div>
                <label className="form-label text-xs">Research Date</label>
                <input type="date" value={mrDate} onChange={e => setMrDate(e.target.value)} className="form-input text-xs" disabled={stepIdx > 0} />
              </div>
              <div className="sm:col-span-2">
                <label className="form-label text-xs">Market Research Notes / Findings</label>
                <textarea value={mrNotes} onChange={e => setMrNotes(e.target.value)} className="form-input text-xs h-20" placeholder="Market rate survey findings, sources checked, prevailing rates..." disabled={stepIdx > 0} />
              </div>
            </div>
            {stepIdx === 0 && (
              <button onClick={() => { if (!mrNotes.trim()) { showToast('Please add market research notes.', 'warning'); return; } advanceToStage('rfq_sent', { marketResearchNotes: mrNotes, marketResearchDate: mrDate }, 'Market research completed'); }} className="btn-primary text-xs">
                Save & Proceed to RFQ →
              </button>
            )}
            {stepIdx > 0 && proc.marketResearchNotes && (
              <div className="bg-sky-50 p-3 rounded-lg text-xs text-sky-900 border border-sky-100">
                <strong>Notes:</strong> {proc.marketResearchNotes}
              </div>
            )}
          </div>

              {stepIdx > 1 && <span className="badge bg-emerald-100 text-emerald-700">✓ Done</span>}

            {stepIdx >= 1 && (

                    <label className="form-label text-xs">Notes / RFQ Details</label>

                        <span className="text-slate-400 text-[10px]">{v.mobile}</span>

                    Confirm RFQ Sent →
                  </button>
                )}
                {stepIdx > 1 && (
                  <div className="flex flex-wrap gap-2">
                    {(proc.rfqSentTo || []).map(vid => {
                      const v = vendors.find(x => x.id === vid);
                      return v ? <span key={vid} className="badge bg-violet-100 text-violet-700">{v.name}</span> : null;
                    })}
                  </div>
                )}
              </>
            )}
          </div>

          {/* ====== STAGE 3: Quotations ====== */}

                <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${stepIdx > 2 ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-100 text-blue-700'}`}>{stepIdx > 2 ? '✓' : '3'}</span>
                📨 Vendor Quotations ({(proc.quotations || []).length} received)
              </h3>
              {stepIdx >= 1 && stepIdx < 4 && (
                <button onClick={() => setShowAddQuote(true)} className="btn-primary text-xs">+ Add Quotation</button>
              )}
            </div>

            {(proc.quotations || []).length === 0 ? (
              <p className="text-xs text-slate-400 italic">No quotations added yet. Click "Add Quotation" to enter vendor quotes.</p>
            ) : (
              <div className="overflow-x-auto">
                <table className="min-w-full text-xs divide-y divide-slate-100">
                  <thead className="bg-slate-50">
                    <tr>
                      <th className="table-th">Vendor</th>
                      <th className="table-th">Quote Date</th>
                      <th className="table-th">Total Amount</th>
                      <th className="table-th">Items Detail</th>
                      <th className="table-th">Document</th>
                      <th className="table-th">Notes</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-50">
                    {(proc.quotations || []).map((q, i) => {
                      const lowestAmt = Math.min(...(proc.quotations || []).map(x => Number(x.totalAmount) || Infinity));
                      const isLowest = Number(q.totalAmount) === lowestAmt;
                      return (
                        <tr key={i} className={isLowest && proc.quotations.length > 1 ? 'bg-emerald-50/60' : ''}>
                          <td className="table-td font-bold text-slate-800">
                            {q.vendorName}
                            {isLowest && proc.quotations.length > 1 && <span className="ml-1 badge bg-emerald-100 text-emerald-700 text-[10px]">🏆 Lowest</span>}
                          </td>
                          <td className="table-td text-slate-500">{q.quoteDate}</td>
                          <td className="table-td font-bold text-slate-900">₹{Number(q.totalAmount || 0).toLocaleString()}</td>
                          <td className="table-td">
                            {(q.items || []).map((it, j) => (
                              <div key={j} className="text-[11px]">{it.itemName}: {it.qty} {it.unit} @ ₹{it.rate} = ₹{it.total}</div>
                            ))}
                          </td>
                          <td className="table-td">
                            {q.docBase64 ? (
                              <button onClick={() => { const w = window.open(); w.document.write(`<iframe src="${q.docBase64}" style="width:100%;height:100%;border:none"></iframe>`); }} className="text-primary-600 hover:underline text-xs">📄 View Doc</button>
                            ) : <span className="text-slate-400 text-[11px]">No doc</span>}
                          </td>
                          <td className="table-td text-slate-500 max-w-xs truncate">{q.notes || '—'}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}

            {(proc.quotations || []).length >= 1 && stepIdx === 2 && (
              <button onClick={() => advanceToStage('comparative_done', { comparativeNotes: compNotes }, 'Comparative statement reviewed')} className="btn-primary text-xs">
                Mark Comparative Done →
              </button>
            )}
          </div>

          {/* ====== STAGE 4: Comparative Statement ====== */}
          <div className={`card p-5 space-y-4 ${stepIdx >= 3 ? '' : 'opacity-40 pointer-events-none'}`}>
            <div className="flex items-center gap-2">
              <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${stepIdx > 3 ? 'bg-emerald-100 text-emerald-700' : 'bg-indigo-100 text-indigo-700'}`}>{stepIdx > 3 ? '✓' : '4'}</span>
              <h3 className="font-bold text-slate-800 text-sm">📊 Comparative Statement (Auto-Generated)</h3>
            </div>
            {stepIdx >= 3 && (
              <>
                {(proc.quotations || []).length > 0 ? (
                  <div className="overflow-x-auto rounded-xl border border-slate-200">
                    <table className="min-w-full text-xs">
                      <thead className="bg-slate-800 text-white">
                        <tr>
                          <th className="px-4 py-3 text-left font-semibold">Vendor</th>
                          <th className="px-4 py-3 text-left font-semibold">Quote Date</th>
                          <th className="px-4 py-3 text-right font-semibold">Total Quoted Amount</th>
                          <th className="px-4 py-3 text-left font-semibold">Rank</th>
                        </tr>
                      </thead>
                      <tbody>
                        {[...proc.quotations].sort((a,b) => Number(a.totalAmount)-Number(b.totalAmount)).map((q, i) => (
                          <tr key={i} className={i === 0 ? 'bg-emerald-50 font-bold' : 'hover:bg-slate-50'}>
                            <td className="px-4 py-3">{q.vendorName} {i===0 ? '🏆' : ''}</td>
                            <td className="px-4 py-3 text-slate-500">{q.quoteDate}</td>
                            <td className="px-4 py-3 text-right font-bold text-slate-900">₹{Number(q.totalAmount||0).toLocaleString()}</td>
                            <td className="px-4 py-3">
                              {i === 0 ? <span className="badge bg-emerald-100 text-emerald-800">L1 Lowest</span> : i === 1 ? <span className="badge bg-amber-100 text-amber-700">L2</span> : <span className="badge bg-slate-100 text-slate-600">L{i+1}</span>}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                ) : <p className="text-xs text-slate-400">Add quotations in Step 3 to generate comparative.</p>}
                <div>
                  <label className="form-label text-xs">Comparative Statement Notes / Observations</label>
                  <textarea value={compNotes} onChange={e => setCompNotes(e.target.value)} className="form-input text-xs h-16" placeholder="Committee observations, quality factors, delivery terms comparison..." disabled={stepIdx > 3} />
                </div>
                {stepIdx === 3 && (
                  <button onClick={() => advanceToStage('vendor_selected', { comparativeNotes: compNotes }, 'Comparative statement finalized')} className="btn-primary text-xs">
                    Finalize Comparative & Proceed →
                  </button>
                )}
              </>
            )}
          </div>

          {/* ====== STAGE 5: Vendor Selection ====== */}
          <div className={`card p-5 space-y-4 ${stepIdx >= 4 ? '' : 'opacity-40 pointer-events-none'}`}>
            <div className="flex items-center gap-2">
              <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${stepIdx > 4 ? 'bg-emerald-100 text-emerald-700' : 'bg-purple-100 text-purple-700'}`}>{stepIdx > 4 ? '✓' : '5'}</span>
              <h3 className="font-bold text-slate-800 text-sm">✅ Vendor Selection</h3>
            </div>
            {stepIdx >= 4 && (
              <>
                <div className="grid sm:grid-cols-2 gap-3">
                  <div>
                    <label className="form-label text-xs">Select Vendor *</label>
                    <select value={selVendorId} onChange={e => setSelVendorId(e.target.value)} className="form-select text-xs" disabled={stepIdx > 4}>
                      <option value="">-- Choose vendor --</option>
                      {(proc.quotations || []).map(q => (
                        <option key={q.vendorId} value={q.vendorId}>{q.vendorName} (₹{Number(q.totalAmount||0).toLocaleString()})</option>
                      ))}
                      {vendors.filter(v => v.isActive).map(v => (
                        <option key={v.id} value={v.id}>{v.name}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="form-label text-xs">Selection Date</label>
                    <input type="date" value={proc.selectionDate || new Date().toISOString().slice(0,10)} onChange={() => {}} className="form-input text-xs" disabled={stepIdx > 4} />
                  </div>
                  <div className="sm:col-span-2">
                    <label className="form-label text-xs">Reason for Selection *</label>
                    <textarea value={selReason} onChange={e => setSelReason(e.target.value)} className="form-input text-xs h-16" placeholder="Why was this vendor selected? (Quality, price, reliability, past experience...)" disabled={stepIdx > 4} />
                  </div>
                </div>
                {stepIdx === 4 && (
                  <button onClick={() => {
                    if (!selVendorId || !selReason.trim()) { showToast('Select a vendor and provide a reason.', 'warning'); return; }
                    const v = vendors.find(x => x.id === selVendorId) || (proc.quotations||[]).find(q => q.vendorId === selVendorId);
                    const vName = v?.name || v?.vendorName || selVendorId;
                    advanceToStage('negotiation', { selectedVendorId: selVendorId, selectedVendorName: vName, selectionReason: selReason, selectionDate: new Date().toISOString().slice(0,10) }, `Vendor selected: ${vName}`);
                  }} className="btn-primary text-xs">
                    Confirm Vendor Selection →
                  </button>
                )}
                {stepIdx > 4 && proc.selectedVendorName && (
                  <div className="bg-purple-50 p-3 rounded-lg text-xs border border-purple-100">
                    <strong>Selected Vendor:</strong> {proc.selectedVendorName}<br/>
                    <strong>Reason:</strong> {proc.selectionReason}
                  </div>
                )}
              </>
            )}
          </div>

            <div className="flex items-center gap-2">
              <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${stepIdx > 5 ? 'bg-emerald-100 text-emerald-700' : 'bg-orange-100 text-orange-700'}`}>{stepIdx > 5 ? '✓' : '6'}</span>
              <h3 className="font-bold text-slate-800 text-sm">🤝 Price Negotiation</h3>
            </div>
            {stepIdx >= 5 && (
              <>
                <div className="grid sm:grid-cols-2 gap-3">
                  <div>
                    <label className="form-label text-xs">Negotiation Date</label>
                    <input type="date" value={negDate} onChange={e => setNegDate(e.target.value)} className="form-input text-xs" disabled={stepIdx > 5} />
                  </div>
                  <div>
                    <label className="form-label text-xs">Final Negotiated Amount (₹)</label>

                  </div>

                    <textarea value={negNotes} onChange={e => setNegNotes(e.target.value)} className="form-input text-xs h-16" placeholder="Payment terms, delivery schedule, quality standards, penalty clauses negotiated..." disabled={stepIdx > 5} />

                  <div className="bg-orange-50 p-3 rounded-lg text-xs border border-orange-100">

                  <div className="sm:col-span-3">
                    <label className="form-label text-xs">Contract Terms & Conditions</label>
                    <textarea value={contractTerms} onChange={e => setContractTerms(e.target.value)} className="form-input text-xs h-20" placeholder="Payment schedule, delivery terms, quality standards, penalty for shortfall..." disabled={stepIdx > 6} />
                  </div>
                  <div className="sm:col-span-3">
                    <label className="form-label text-xs">Contract Document Upload</label>
                    {stepIdx === 6 ? (
                      <div className="space-y-2">
                        <input type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" onChange={handleContractFile} className="block w-full text-xs text-slate-500 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-primary-50 file:text-primary-700 hover:file:bg-primary-100" />
                        {contractDocName && <p className="text-xs text-emerald-600">✓ Loaded: {contractDocName}</p>}
                      </div>
                    ) : (
                      proc.contractDocBase64 ? (
                        <button onClick={() => { const w = window.open(); w.document.write(`<iframe src="${proc.contractDocBase64}" style="width:100%;height:100%;border:none"></iframe>`); }} className="text-primary-600 hover:underline text-xs">📄 View Contract Document</button>
                      ) : <span className="text-xs text-slate-400">No contract document uploaded</span>
                    )}
                  </div>
                </div>
                {stepIdx === 6 && (
                  <button onClick={() => {
                    if (!contractNum.trim()) { showToast('Enter contract number.', 'warning'); return; }
                    advanceToStage('procurement_completed', { contractNumber: contractNum, contractStartDate: contractStart, contractEndDate: contractEnd, contractTerms, contractDocBase64, contractDocName }, `Contract ${contractNum} signed with ${proc.selectedVendorName}`);
                  }} className="btn-success text-xs">
                    🎉 Sign Contract & Complete Procurement
                  </button>
                )}
                {stepIdx > 6 && (
                  <div className="bg-teal-50 p-3 rounded-lg text-xs border border-teal-100">
                    <strong>Contract No:</strong> {proc.contractNumber} &nbsp;|&nbsp; <strong>Period:</strong> {proc.contractStartDate} to {proc.contractEndDate}<br/>
                    <strong>Terms:</strong> {proc.contractTerms}
                  </div>
                )}
              </>
            )}
          </div>

          {/* ====== STAGE 8: Completion ====== */}
          {proc.status === 'procurement_completed' && (
            <div className="card p-5 space-y-3 bg-gradient-to-br from-emerald-50 to-teal-50 border-2 border-emerald-200">
              <h3 className="font-bold text-emerald-800 text-sm flex items-center gap-2">🎉 Procurement Completed!</h3>
              <div className="grid sm:grid-cols-2 gap-3 text-xs text-slate-700">
                <div><strong>Procurement ID:</strong> {proc.id}</div>
                <div><strong>Title:</strong> {proc.title}</div>
                <div><strong>Selected Vendor:</strong> {proc.selectedVendorName}</div>
                <div><strong>Negotiated Amount:</strong> ₹{Number(proc.finalNegotiatedAmount||0).toLocaleString()}</div>
                <div><strong>Contract No:</strong> {proc.contractNumber}</div>
                <div><strong>Contract Period:</strong> {proc.contractStartDate} — {proc.contractEndDate}</div>
              </div>
              <p className="text-xs text-emerald-700 bg-emerald-100 p-2 rounded-lg">✅ This procurement has been completed successfully. Purchases can now be created against this contract using the Purchases section.</p>
            </div>
          )}

          {/* Cancelled Notice */}
          {proc.status === 'cancelled' && (
            <div className="card p-5 bg-red-50 border-2 border-red-200 text-center">
              <p className="font-bold text-red-700 text-sm">✕ This Procurement was Cancelled</p>
              <p className="text-xs text-red-500 mt-1">No further actions can be taken on this procurement.</p>
            </div>
          )}

          {/* Audit History */}
          {(proc.history || []).length > 0 && (
            <div className="card p-5 space-y-3">
              <h3 className="font-bold text-slate-800 text-sm">📅 Procurement History & Timeline</h3>
              <div className="space-y-2">
                {[...(proc.history || [])].reverse().map((h, i) => (
                  <div key={i} className="flex items-start gap-3 text-xs">
                    <div className="w-2 h-2 mt-1.5 rounded-full bg-violet-400 shrink-0"></div>
                    <div>
                      <span className="font-semibold text-slate-800">{PROC_STEPS.find(s=>s.key===h.stage)?.label || h.stage}</span>
                      <span className="text-slate-400 ml-2">by {h.by}</span>
                      <span className="text-slate-400 ml-2">· {new Date(h.at).toLocaleString('en-IN')}</span>
                      {h.note && <p className="text-slate-500 mt-0.5 italic">{h.note}</p>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Add Quotation Modal */}
          {showAddQuote && (
            <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
              <form onSubmit={handleAddQuote} className="bg-white rounded-2xl p-6 max-w-lg w-full space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-slate-800">Add Vendor Quotation</h3>
                  <button type="button" onClick={() => setShowAddQuote(false)} className="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
                </div>
                <div className="grid sm:grid-cols-2 gap-3">
                  <div>
                    <label className="form-label text-xs">Vendor *</label>
                    <select value={newQuote.vendorId} onChange={e => setNewQuote(q => ({...q, vendorId: e.target.value}))} className="form-select text-xs" required>
                      <option value="">-- Select Vendor --</option>
                      {vendors.filter(v => v.isActive).map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="form-label text-xs">Quotation Date</label>
                    <input type="date" value={newQuote.quoteDate} onChange={e => setNewQuote(q => ({...q, quoteDate: e.target.value}))} className="form-input text-xs" />
                  </div>
                  <div>
                    <label className="form-label text-xs">Total Quoted Amount (₹) *</label>
                    <input type="number" value={newQuote.totalAmount} onChange={e => setNewQuote(q => ({...q, totalAmount: e.target.value}))} className="form-input text-xs font-bold" placeholder="0.00" required />
                  </div>
                  <div>
                    <label className="form-label text-xs">Notes</label>
                    <input type="text" value={newQuote.notes} onChange={e => setNewQuote(q => ({...q, notes: e.target.value}))} className="form-input text-xs" placeholder="Delivery terms, payment mode..." />
                  </div>
                </div>
                <div>
                  <div className="flex justify-between items-center mb-2">
                    <label className="form-label text-xs">Item-wise Rates</label>
                    <button type="button" onClick={() => setNewQuote(q => ({...q, items: [...q.items, {itemName: '', unit: 'kg', qty: '', rate: '', total: ''}]}))} className="text-primary-600 text-xs font-bold">+ Row</button>
                  </div>
                  {newQuote.items.map((it, i) => (
                    <div key={i} className="grid grid-cols-5 gap-1.5 mb-1.5 text-xs">
                      <input type="text" value={it.itemName} onChange={e => setNewQuote(q => ({...q, items: q.items.map((x,j) => j===i?{...x,itemName:e.target.value}:x)}))} className="form-input text-xs col-span-2" placeholder="Item name" />
                      <input type="number" value={it.qty} onChange={e => setNewQuote(q => ({...q, items: q.items.map((x,j) => j===i?{...x,qty:e.target.value,total:String(Number(e.target.value)*Number(x.rate||0))}:x)}))} className="form-input text-xs" placeholder="Qty" />
                      <input type="number" value={it.rate} onChange={e => setNewQuote(q => ({...q, items: q.items.map((x,j) => j===i?{...x,rate:e.target.value,total:String(Number(e.target.value)*Number(x.qty||0))}:x)}))} className="form-input text-xs" placeholder="Rate ₹" />
                      <input type="number" value={it.total} readOnly className="form-input text-xs bg-slate-50" placeholder="Total" />
                    </div>
                  ))}
                </div>
                <div>
                  <label className="form-label text-xs">Upload Quotation Document</label>
                  <input type="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" onChange={handleQuoteFile} className="block w-full text-xs text-slate-500 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-primary-50 file:text-primary-700 hover:file:bg-primary-100" />
                  {newQuote.docName && <p className="text-xs text-emerald-600 mt-1">✓ {newQuote.docName}</p>}
                </div>
                <div className="flex justify-end gap-2 pt-2 border-t">
                  <button type="button" onClick={() => setShowAddQuote(false)} className="btn-secondary text-xs">Cancel</button>
                  <button type="submit" className="btn-primary text-xs">Save Quotation</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
