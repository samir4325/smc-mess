    // --- GOODS RECEIVED NOTE (GRN) VIEW (WITH MULTI-ITEM SUPPORT) ---
    function GRNView({ currentUser, onUpdate }) {
      const [grns, setGrns] = useState(() => ls_get('grns', []));
      const [purchases, setPurchases] = useState(() => ls_get('purchases', []));
      const [items, setItems] = useState(() => ls_get('items', []));
      const [isCreating, setIsCreating] = useState(false);

      const [selectedPurId, setSelectedPurId] = useState('');
      const [grnItems, setGrnItems] = useState([]); // [{ itemId, itemName, unit, orderedQty, receivedQty, shortQty, condition }]
      const [remarks, setRemarks] = useState('');

      const selPur = purchases.find(p => p.id === selectedPurId);

      // When a purchase order is selected, load its items into the GRN form
      useEffect(() => {
        if (!selPur) {
          setGrnItems([]);
          return;
        }
        const pItems = normalizeItems(selPur);
        setGrnItems(pItems.map(it => ({
          itemId: it.itemId,
          itemName: it.itemName,
          unit: it.unit || 'kg',
          orderedQty: Number(it.orderedQty || it.requiredQty || 0),
          receivedQty: Number(it.orderedQty || it.requiredQty || 0),
          shortQty: 0,
          condition: 'Good'
        })));
      }, [selPur]);

      const handleItemFieldChange = (idx, field, val) => {
        const updated = [...grnItems];
        updated[idx][field] = val;
        if (field === 'receivedQty') {
          const rec = Number(val || 0);
          const ord = Number(updated[idx].orderedQty || 0);
          updated[idx].shortQty = Math.max(0, ord - rec);
        }
        setGrnItems(updated);
      };

      const handleCreateGRN = (e) => {
        e.preventDefault();
        if (!selPur || grnItems.length === 0) return;
        const grnId = getNextId('GRN');

        let updatedItems = [...items];
        let totalShortQty = 0;

        // Process stock additions and shortages for each item in the GRN
        grnItems.forEach(gi => {
          const recNum = Number(gi.receivedQty || 0);
          const shNum = Number(gi.shortQty || 0);
          totalShortQty += shNum;

          // Increment current stock in warehouse
          updatedItems = updatedItems.map(i => i.id === gi.itemId ? { ...i, currentStock: Number(i.currentStock) + recNum } : i);

          // Record individual shortage if any
          if (shNum > 0) {
            const ssList = ls_get('shortSupplies', []);
            const ssId = getNextId('SS');
            const newSS = {
              id: ssId,
              grnId,
              purchaseId: selPur.id,
              requestId: selPur.requestId,
              itemId: gi.itemId,
              itemName: gi.itemName,
              shortQty: shNum,
              issueType: 'short_quantity',
              status: 'open',
              createdAt: new Date().toISOString()
            };
            ls_set('shortSupplies', [...ssList, newSS]);
          }
        });

        ls_set('items', updatedItems);
        setItems(updatedItems);

        // Update purchase order status
        const updatedPurchases = purchases.map(p => {
          if (p.id === selPur.id) {
            return {
              ...p,
              status: totalShortQty > 0 ? 'partially_received' : 'fully_received'
            };
          }
          return p;
        });
        ls_set('purchases', updatedPurchases);
        setPurchases(updatedPurchases);

        const newGrn = {
          id: grnId,
          purchaseId: selPur.id,
          requestId: selPur.requestId,
          items: grnItems,
          remarks,
          receivedDate: new Date().toISOString().slice(0, 10),
          createdBy: currentUser.name,
          createdAt: new Date().toISOString()
        };

        const updatedGrns = [...grns, newGrn];
        ls_set('grns', updatedGrns);
        setGrns(updatedGrns);

        showToast(`GRN ${grnId} generated with ${grnItems.length} items! Warehouse stock updated.`, 'success');
        setIsCreating(false);
        setSelectedPurId('');
        setGrnItems([]);
        onUpdate();
      };

      return (
        <div className="space-y-4">
          <div className="flex justify-between items-center">
            <div>
              <h3 className="font-bold text-slate-800 text-sm">Goods Received Notes (GRN) Management</h3>
              <p className="text-xs text-slate-500">Receive multiple items per delivery and update stock in real-time.</p>
            </div>
            <button onClick={() => setIsCreating(true)} className="btn-primary text-xs">+ Create GRN Receipt (Multi-Item)</button>
          </div>

          <div className="card overflow-x-auto">
            <table className="min-w-full divide-y divide-slate-200 text-xs">
              <thead>
                <tr>
                  <th className="table-th">GRN ID</th>
                  <th className="table-th">Purchase ID</th>
                  <th className="table-th">Received Items & Quantities</th>
                  <th className="table-th">Shortage Status</th>
                  <th className="table-th">Date</th>
                  <th className="table-th">Verified By</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {grns.length === 0 ? (
                  <tr><td colSpan={6} className="text-center py-6 text-slate-400">No GRN receipts created yet.</td></tr>
                ) : (
                  grns.map(g => {
                    const gItems = normalizeItems(g);
                    const totalShort = gItems.reduce((s, it) => s + Number(it.shortQty || 0), 0);

                    return (
                      <tr key={g.id} className="hover:bg-slate-50">
                        <td className="table-td font-mono font-bold text-primary-700">{g.id}</td>
                        <td className="table-td font-mono text-slate-500">{g.purchaseId}</td>
                        <td className="table-td">
                          <div className="space-y-1">
                            {gItems.map((it, idx) => (
                              <div key={idx} className="flex items-center gap-2">
                                <span className="font-semibold text-slate-800">{it.itemName}:</span>
                                <span className="font-bold text-emerald-600">+{it.receivedQty} {it.unit}</span>
                                <span className="text-slate-400 text-[11px]">(Ordered: {it.orderedQty} {it.unit})</span>
                                <span className="badge bg-slate-100 text-slate-700 text-[10px]">{it.condition || 'Good'}</span>
                              </div>
                            ))}
                          </div>
                        </td>
                        <td className="table-td">
                          {totalShort > 0 ? (
                            <span className="font-bold text-red-600">⚠️ {totalShort} Qty Short</span>
                          ) : (
                            <span className="badge bg-emerald-100 text-emerald-800">✓ Complete</span>
                          )}
                        </td>
                        <td className="table-td text-slate-400">{g.receivedDate}</td>
                        <td className="table-td text-slate-600 font-medium">{g.createdBy}</td>
                      </tr>
                    );
                  })
                )}
              </tbody>
            </table>
          </div>

          {isCreating && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <form onSubmit={handleCreateGRN} className="bg-white rounded-xl p-6 max-w-2xl w-full space-y-4 shadow-2xl max-h-[90vh] flex flex-col">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-slate-800 text-sm">Create Goods Received Note (GRN) — Multi-Item</h3>
                  <span className="badge bg-primary-100 text-primary-800 font-mono">Storage</span>
                </div>

                <div className="space-y-3 flex-1 overflow-y-auto pr-1">
                  <div>
                    <label className="form-label">Select Purchase Order *</label>
                    <select value={selectedPurId} onChange={e => setSelectedPurId(e.target.value)} className="form-select text-xs" required>
                      <option value="">Select an active purchase order...</option>
                      {purchases.filter(p => p.status === 'ordered' || p.status === 'partially_received').map(p => {
                        const pItems = normalizeItems(p);
                        const names = pItems.map(it => `${it.itemName} (${it.orderedQty} ${it.unit})`).join(', ');
                        return <option key={p.id} value={p.id}>{p.id} — {names}</option>;
                      })}
                    </select>
                  </div>

                  {selPur && grnItems.length > 0 && (
                    <div className="border border-slate-200 rounded-xl p-3 bg-slate-50 space-y-3">
                      <p className="text-xs font-bold text-slate-700">Ordered Items in {selPur.id}:</p>
                      {grnItems.map((gi, idx) => (
                        <div key={idx} className="bg-white p-3 rounded-lg border border-slate-200 grid grid-cols-1 sm:grid-cols-4 gap-2 items-center">
                          <div className="sm:col-span-1">
                            <p className="font-semibold text-slate-800 text-xs">{gi.itemName}</p>
                            <p className="text-[11px] text-slate-500">Ordered: <strong>{gi.orderedQty} {gi.unit}</strong></p>
                          </div>
                          <div>
                            <label className="text-[10px] text-slate-500 block">Received Qty ({gi.unit}) *</label>
                            <input 
                              type="number" 
                              step="0.01" 
                              value={gi.receivedQty} 
                              onChange={e => handleItemFieldChange(idx, 'receivedQty', e.target.value)} 
                              className="form-input text-xs font-bold text-emerald-700 py-1" 
                              required 
                            />
                          </div>
                          <div>
                            <label className="text-[10px] text-slate-500 block">Shortage Qty</label>
                            <span className={`text-xs font-bold ${gi.shortQty > 0 ? 'text-red-600' : 'text-slate-400'}`}>
                              {gi.shortQty > 0 ? `${gi.shortQty} ${gi.unit}` : '0 (None)'}
                            </span>
                          </div>
                          <div>
                            <label className="text-[10px] text-slate-500 block">Condition</label>
                            <select 
                              value={gi.condition} 
                              onChange={e => handleItemFieldChange(idx, 'condition', e.target.value)} 
                              className="form-select text-xs py-1"
                            >
                              <option>Good</option>
                              <option>Damaged</option>
                              <option>Mixed</option>
                            </select>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  <div>
                    <label className="form-label">Delivery Remarks</label>
                    <input type="text" value={remarks} onChange={e => setRemarks(e.target.value)} className="form-input text-xs" placeholder="e.g. Received in good condition by storekeeper" />
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t">
                  <button type="button" onClick={() => setIsCreating(false)} className="btn-secondary text-xs">Cancel</button>
                  <button type="submit" disabled={!selPur || grnItems.length === 0} className="btn-primary text-xs">Submit GRN & Increment Stock</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    // --- STOCK OUT VIEW (WITH UPPER LIMIT CHECK & ADMIN APPROVAL WORKFLOW) ---
    function StockOutView({ currentUser, onUpdate }) {
      const [stockOuts, setStockOuts] = useState(() => ls_get('stockOuts', []));
      const [items, setItems] = useState(() => ls_get('items', []));
      const [purpose, setPurpose] = useState('Kitchen - Daily Cooking');
      const [approvalRemark, setApprovalRemark] = useState('');

      // Multi-item rows for single stock out issue
      const [outRows, setOutRows] = useState([{ itemId: '', qty: '', unit: 'kg' }]);

      const handleAddRow = () => {
        setOutRows([...outRows, { itemId: '', qty: '', unit: 'kg' }]);
      };

      const handleRemoveRow = (idx) => {
        if (outRows.length === 1) return;
        setOutRows(outRows.filter((_, i) => i !== idx));
      };

      const handleRowChange = (idx, field, val) => {
        const updated = [...outRows];
        updated[idx][field] = val;
        if (field === 'itemId') {
          const sel = items.find(i => i.id === val);
          if (sel) {
            updated[idx].unit = sel.unit;
          }
        }
        setOutRows(updated);
      };

      // Check if any row exceeds the item's configured Upper Limit
      const hasAnyExceededLimit = useMemo(() => {
        return outRows.some(r => {
          if (!r.itemId || !r.qty) return false;
          const sel = items.find(i => i.id === r.itemId);
          const limit = sel?.upperLimit ? Number(sel.upperLimit) : 0;
          return limit > 0 && Number(r.qty) > limit;
        });
      }, [outRows, items]);

      const handleSubmit = (e) => {
        e.preventDefault();
        
        // Validate all rows
        for (let r of outRows) {
          if (!r.itemId || !r.qty || Number(r.qty) <= 0) {
            showToast('Please select an item and enter valid quantity for all rows.', 'error');
            return;
          }
          const itemObj = items.find(i => i.id === r.itemId);
          if (itemObj && Number(r.qty) > itemObj.currentStock) {
            showToast(`Cannot issue ${r.qty} of ${itemObj.name}. Only ${itemObj.currentStock} ${itemObj.unit} available in store!`, 'error');
            return;
          }
        }

        const id = getNextId('STKOUT');
        const issuedItemsList = [];
        let anyExceeded = false;

        outRows.forEach(r => {
          const itemObj = items.find(i => i.id === r.itemId);
          const qtyNum = Number(r.qty);
          const limit = itemObj?.upperLimit ? Number(itemObj.upperLimit) : 0;
          const isExceeded = limit > 0 && qtyNum > limit;
          if (isExceeded) anyExceeded = true;

          issuedItemsList.push({
            itemId: itemObj.id,
            itemName: itemObj.name,
            unit: itemObj.unit,
            packSize: itemObj.packSize || 'Not Specified',
            qty: qtyNum,
            upperLimit: limit,
            isExceeded: isExceeded
          });
        });

        if (anyExceeded && !approvalRemark.trim()) {
          showToast('Please provide a mandatory reason explaining why the Stock Out exceeds the Upper Limit.', 'warning');
          return;
        }

        const now = new Date();

        if (anyExceeded) {
          // Requires Super Admin Approval -> DO NOT DEDUCT STOCK YET
          const newEntry = {
            id,
            items: issuedItemsList,
            purpose,
            issuedBy: currentUser.name,
            status: 'pending_approval',
            requiresAdminApproval: true,
            isExceeded: true,
            reason: approvalRemark.trim(),
            date: now.toISOString().slice(0, 10),
            time: now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }),
            createdAt: now.toISOString()
          };

          const updatedStockOuts = [newEntry, ...stockOuts];
          ls_set('stockOuts', updatedStockOuts);
          setStockOuts(updatedStockOuts);

          logActivity(
            'Requested Stock Out Approval (Exceeded Limit)',
            'STORAGE',
            id,
            `Storage member ${currentUser.name} requested issue of ${issuedItemsList.map(i => `${i.itemName} (${i.qty} ${i.unit})`).join(', ')}. Reason: ${approvalRemark.trim()}`
          );

          showToast(`⚠️ Stock Out ${id} exceeds Upper Limit and has been submitted to Admin for approval! (Stock will be deducted after Admin approves)`, 'warning');
        } else {
          // Within limits -> Deduct Stock Immediately
          let updatedItems = [...items];
          issuedItemsList.forEach(it => {
            updatedItems = updatedItems.map(i => i.id === it.itemId ? { ...i, currentStock: i.currentStock - it.qty } : i);
          });

          ls_set('items', updatedItems);
          setItems(updatedItems);

          const newEntry = {
            id,
            items: issuedItemsList,
            purpose,
            issuedBy: currentUser.name,
            status: 'approved',
            requiresAdminApproval: false,
            date: now.toISOString().slice(0, 10),
            time: now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }),
            createdAt: now.toISOString()
          };

          const updatedStockOuts = [newEntry, ...stockOuts];
          ls_set('stockOuts', updatedStockOuts);
          setStockOuts(updatedStockOuts);

          logActivity(
            'Issued Stock Out',
            'STORAGE',
            id,
            `Issued ${issuedItemsList.map(i => `${i.itemName} (${i.qty} ${i.unit})`).join(', ')} for "${purpose}"`
          );

          showToast(`Issued ${issuedItemsList.length} items from Store! (ID: ${id})`, 'success');
        }

        setOutRows([{ itemId: '', qty: '', unit: 'kg' }]);
        setApprovalRemark('');
        onUpdate();
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div className="card p-5 space-y-4">
            <div className="flex justify-between items-center">
              <div>
                <h3 className="font-bold text-slate-800 text-sm">Issue Material from Store</h3>
                <p className="text-[11px] text-slate-500">Exceeding Upper Limit auto-forwards to Super Admin for approval.</p>
              </div>
              <span className="badge bg-primary-100 text-primary-800 text-[11px]">Storage</span>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="form-label">Purpose of Issue *</label>
                <input type="text" value={purpose} onChange={e => setPurpose(e.target.value)} className="form-input text-xs" required />
              </div>

              <div className="space-y-3">
                <div className="flex justify-between items-center">
                  <label className="text-xs font-semibold text-slate-700">Items to Issue:</label>
                  <button type="button" onClick={handleAddRow} className="text-primary-600 hover:text-primary-700 text-xs font-bold">
                    + Add Item Row
                  </button>
                </div>

                {outRows.map((row, idx) => {
                  const sel = items.find(i => i.id === row.itemId);
                  const isStockShort = sel && Number(row.qty) > sel.currentStock;
                  const limit = sel?.upperLimit ? Number(sel.upperLimit) : 0;
                  const isLimitExceeded = limit > 0 && Number(row.qty) > limit;

                  return (
                    <div key={idx} className={`p-3 rounded-lg border space-y-2 relative ${isLimitExceeded ? 'border-amber-300 bg-amber-50/60' : 'border-slate-200 bg-slate-50'}`}>
                      <div className="flex justify-between items-center">
                        <span className="text-[11px] font-bold text-slate-600">Item #{idx + 1}</span>
                        {outRows.length > 1 && (
                          <button type="button" onClick={() => handleRemoveRow(idx)} className="text-red-500 hover:text-red-700 text-xs font-bold">
                            ✕ Remove
                          </button>
                        )}
                      </div>

                      <select 
                        value={row.itemId} 
                        onChange={e => handleRowChange(idx, 'itemId', e.target.value)} 
                        className="form-select text-xs" 
                        required
                      >
                        <option value="">Select store item...</option>
                        {items.map(i => (
                          <option key={i.id} value={i.id}>
                            {i.name} {i.brand && i.brand !== 'Not Specified' ? `(${i.brand})` : ''} — Stock: {i.currentStock} {i.unit} {i.upperLimit > 0 ? `[Limit: ${i.upperLimit} ${i.unit}]` : ''}
                          </option>
                        ))}
                      </select>

                      {sel && (
                        <div className="flex justify-between text-[11px] font-medium">
                          <span className="text-primary-700">Available: <strong>{sel.currentStock} {sel.unit}</strong></span>
                          {limit > 0 ? (
                            <span className="text-amber-800">Upper Limit: <strong>{limit} {sel.unit}</strong></span>
                          ) : (
                            <span className="text-slate-400">No Limit</span>
                          )}
                        </div>
                      )}

                      <div className="flex gap-2 items-center">
                        <input 
                          type="number" 
                          step="0.01" 
                          value={row.qty} 
                          onChange={e => handleRowChange(idx, 'qty', e.target.value)} 
                          placeholder="Quantity to issue" 
                          className={`form-input text-xs font-bold ${isStockShort ? 'border-red-500 bg-red-50' : isLimitExceeded ? 'border-amber-500 bg-amber-100/50' : ''}`} 
                          required 
                        />
                        <span className="text-xs font-semibold text-slate-600 whitespace-nowrap">{row.unit}</span>
                      </div>

                      {isStockShort && <p className="text-red-600 text-[10px] font-bold">⚠️ Exceeds currently available stock ({sel.currentStock} {sel.unit})!</p>}
                      {isLimitExceeded && !isStockShort && (
                        <div className="bg-amber-100 text-amber-900 border border-amber-300 rounded p-1.5 text-[10px] font-semibold">
                          🛡️ Exceeds Upper Limit ({limit} {sel.unit}) — Requires Super Admin Approval!
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>

              {/* Mandatory Reason for Exceeding Upper Limit */}
              {hasAnyExceededLimit && (
                <div className="bg-amber-50 border-2 border-amber-300 rounded-xl p-3.5 space-y-2 animate-pulse">
                  <div className="flex items-center gap-1.5 text-amber-900 font-bold text-xs">
                    <span>⚠️</span>
                    <span>Admin Approval Required</span>
                  </div>
                  <p className="text-[11px] text-amber-800">
                    One or more items exceed the configured Upper Limit. Please enter a detailed reason for the Super Admin to review.
                  </p>
                  <div>
                    <label className="form-label text-amber-900 font-bold text-xs">Remark / Reason for Exceeding Limit *</label>
                    <textarea 
                      value={approvalRemark} 
                      onChange={e => setApprovalRemark(e.target.value)} 
                      className="form-input text-xs h-16 border-amber-300" 
                      placeholder="e.g. Extra quantity required for Sunday Special Feast (150 students)..." 
                      required 
                    />
                  </div>
                </div>
              )}

              <button 
                type="submit" 
                className={`w-full justify-center text-xs py-2.5 shadow-sm font-semibold ${
                  hasAnyExceededLimit ? 'btn-warning bg-amber-600 hover:bg-amber-700' : 'btn-danger'
                }`}
              >
                {hasAnyExceededLimit ? '🛡️ Submit for Admin Approval' : 'Confirm & Issue Items'}
              </button>
            </form>
          </div>

          <div className="card p-5 lg:col-span-2 space-y-3">
            <h3 className="font-bold text-slate-800 text-sm">Stock Out Transactions & Approval Status</h3>
            <div className="overflow-x-auto">
              <table className="min-w-full divide-y divide-slate-100 text-xs">
                <thead>
                  <tr>
                    <th className="table-th">Issue ID</th>
                    <th className="table-th">Issued Items</th>
                    <th className="table-th">Purpose</th>
                    <th className="table-th">Issued By</th>
                    <th className="table-th">Status</th>
                    <th className="table-th">Date</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-50">
                  {stockOuts.length === 0 ? (
                    <tr><td colSpan={6} className="text-center py-6 text-slate-400">No stock out transactions yet.</td></tr>
                  ) : (
                    stockOuts.slice(0, 15).map(so => {
                      const soItems = normalizeItems(so);
                      const isPending = so.status === 'pending_approval' || so.requiresAdminApproval;
                      const isApproved = so.status === 'approved' || (!so.status && !isPending);
                      const isRejected = so.status === 'rejected';

                      return (
                        <tr key={so.id} className={isPending ? 'bg-amber-50/50' : ''}>
                          <td className="table-td font-mono font-bold text-slate-700">{so.id}</td>
                          <td className="table-td">
                            <div className="space-y-1">
                              {soItems.map((it, idx) => (
                                <div key={idx} className="flex items-center gap-1.5">
                                  <span className="font-semibold text-slate-800">• {it.itemName}:</span>
                                  <span className={`font-bold ${isPending ? 'text-amber-700' : 'text-red-600'}`}>
                                    {it.qty} {it.unit}
                                  </span>
                                  {it.isExceeded && (
                                    <span className="badge bg-amber-100 text-amber-800 text-[10px]">Exceeded Limit</span>
                                  )}
                                </div>
                              ))}
                            </div>
                            {so.reason && (
                              <div className="mt-1 text-[10px] text-amber-800 bg-amber-100/60 p-1 rounded italic max-w-xs">
                                <strong>Remark:</strong> {so.reason}
                              </div>
                            )}
                            {so.adminRemark && (
                              <div className="mt-1 text-[10px] text-red-800 bg-red-100/60 p-1 rounded italic max-w-xs">
                                <strong>Admin Remark:</strong> {so.adminRemark}
                              </div>
                            )}
                          </td>
                          <td className="table-td text-slate-600">{so.purpose}</td>
                          <td className="table-td text-slate-500 font-medium">{so.issuedBy}</td>
                          <td className="table-td">
                            {isPending && <span className="badge bg-amber-100 text-amber-800 border border-amber-300">⏳ Pending Approval</span>}
                            {isApproved && <span className="badge bg-emerald-100 text-emerald-800">✓ Approved / Issued</span>}
                            {isRejected && <span className="badge bg-red-100 text-red-800">✕ Rejected</span>}
                          </td>
                          <td className="table-td text-slate-400 whitespace-nowrap">
                            <div>{so.date}</div>
                            {so.time && <div className="text-[10px] text-slate-400">{so.time}</div>}
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // --- REQUESTS VIEW & ORDER PURCHASE (GROUPED MULTIPLE ITEMS UNDER ONE REQUEST ID) ---
    function RequestsView({ role, currentUser, onUpdate }) {
      const [requests, setRequests] = useState(() => ls_get('requests', []));
      const [items] = useState(() => ls_get('items', []));
      const [vendors] = useState(() => ls_get('vendors', []));

      // Multi-item Request creation state
      const [isCreating, setIsCreating] = useState(false);
      const [reqItems, setReqItems] = useState([{ itemId: '', requiredQty: '', unit: 'kg' }]);
      const [priority, setPriority] = useState('Normal');
      const [reason, setReason] = useState('Hostel Mess replenishment');

      // Purchase Modal state for a Grouped Request
      const [purchaseModalReq, setPurchaseModalReq] = useState(null);
      const [vendorId, setVendorId] = useState(vendors[0]?.id || '');
      const [purOrderItems, setPurOrderItems] = useState([]);
      const [expectedDelivery, setExpectedDelivery] = useState('');

      // View Request Details modal
      const [viewingReq, setViewingReq] = useState(null);
      const [deleteModalReq, setDeleteModalReq] = useState(null);

      const confirmDeleteRequest = () => {
        if (!deleteModalReq) return;
        const r = deleteModalReq;
        const norm = normalizeItems(r);
        const itemSummary = norm.map(it => `${it.itemName} (${it.requiredQty} ${it.unit})`).join(', ');
        const updated = requests.filter(x => x.id !== r.id);
        ls_set('requests', updated);
        setRequests(updated);
        moveToTrash('requests', r, `Request: ${r.id} - ${itemSummary}`, currentUser);
        logActivity('Deleted Request', 'STORAGE', `${r.id}`, `Items: ${itemSummary} (Deleted by ${currentUser?.name || 'User'})`);
        showToast(`Request ${r.id} deleted! (Moved to Trash Bin)`, 'success');
        setDeleteModalReq(null);
        if (onUpdate) onUpdate();
      };

      const handleAddReqRow = () => {
        setReqItems([...reqItems, { itemId: '', requiredQty: '', unit: 'kg' }]);
      };

      const handleRemoveReqRow = (idx) => {
        if (reqItems.length === 1) return;
        setReqItems(reqItems.filter((_, i) => i !== idx));
      };

      const handleReqRowChange = (idx, field, val) => {
        const updated = [...reqItems];
        updated[idx][field] = val;
        if (field === 'itemId') {
          const it = items.find(i => i.id === val);
          if (it) {
            updated[idx].unit = it.unit;
          }
        }
        setReqItems(updated);
      };

      const handleCreateGroupedReq = (e) => {
        e.preventDefault();
        
        // Validate rows
        const validRows = [];
        for (let r of reqItems) {
          if (!r.itemId || !r.requiredQty || Number(r.requiredQty) <= 0) {
            showToast('Please select item and enter required quantity for all rows.', 'error');
            return;
          }
          const itemObj = items.find(i => i.id === r.itemId);
          validRows.push({
            itemId: itemObj.id,
            itemName: itemObj.name,
            unit: itemObj.unit,
            packSize: itemObj.packSize || 'Not Specified',
            requiredQty: Number(r.requiredQty)
          });
        }

        const id = getNextId('REQ');
        const newReq = {
          id,
          items: validRows.sort((a, b) => a.itemName.localeCompare(b.itemName)),
          priority,
          reason,
          status: 'pending',
          requestedBy: currentUser.name,
          requestDate: new Date().toISOString().slice(0, 10),
          createdAt: new Date().toISOString()
        };

        const updated = [...requests, newReq];
        ls_set('requests', updated);
        setRequests(updated);
        showToast(`Grouped Request ${id} with ${validRows.length} items submitted to Procurement!`, 'success');
        setIsCreating(false);
        setReqItems([{ itemId: '', requiredQty: '', unit: 'kg' }]);
        onUpdate();
      };

      // Open purchase order modal for a grouped request
      const openPurchaseModal = (req) => {
        setPurchaseModalReq(req);
        const normItems = normalizeItems(req);
        setPurOrderItems(normItems.map(it => ({
          itemId: it.itemId,
          itemName: it.itemName,
          unit: it.unit,
          packSize: it.packSize || 'Not Specified',
          orderedQty: it.requiredQty
        })));
        setVendorId(vendors[0]?.id || '');
      };

      const handleCreateGroupedPurchase = (e) => {
        e.preventDefault();
        if (!purchaseModalReq || purOrderItems.length === 0) return;

        const purId = getNextId('PUR');
        const selVendor = vendors.find(v => v.id === vendorId);

        const newPur = {
          id: purId,
          requestId: purchaseModalReq.id,
          vendorId,
          vendorName: selVendor?.name || vendorId,
          items: purOrderItems.map(it => ({
            itemId: it.itemId,
            itemName: it.itemName,
            unit: it.unit,
            packSize: it.packSize || 'Not Specified',
            orderedQty: Number(it.orderedQty)
          })),
          expectedDelivery: expectedDelivery || new Date().toISOString().slice(0, 10),
          status: 'ordered',
          purchaseDate: new Date().toISOString().slice(0, 10),
          createdBy: currentUser.name,
          createdAt: new Date().toISOString()
        };

        const purchases = ls_get('purchases', []);
        ls_set('purchases', [...purchases, newPur]);

        // Mark request as ordered
        const updatedReqs = requests.map(r => r.id === purchaseModalReq.id ? { ...r, status: 'ordered', purchaseId: purId } : r);
        ls_set('requests', updatedReqs);
        setRequests(updatedReqs);

        showToast(`Purchase Order ${purId} placed with ${selVendor?.name} for all items!`, 'success');
        setPurchaseModalReq(null);
        onUpdate();
      };

      const handleExportRequestsPDF = () => {
        if (!requests || requests.length === 0) {
          showToast('No requests to export', 'warning');
          return;
        }
        const headers = ['Request ID', 'Items (Quantity)', 'Priority', 'Status', 'Date', 'Requested By'];
        const rows = requests.map(r => {
          const norm = normalizeItems(r);
          const itemsStr = norm.map(it => `${it.itemName}: ${it.requiredQty} ${it.unit}`).join('\n');
          return [
            r.id,
            itemsStr,
            r.priority || 'Normal',
            (r.status || 'pending').toUpperCase(),
            r.requestDate || r.date || '—',
            r.requestedBy || 'Storage Committee'
          ];
        });
        exportPDF(headers, rows, 'SMC GEC Palanpur — Storage Procurement Requests Report', 'SMC_Storage_Requests');
      };

      return (
        <div className="space-y-4">
          <div className="flex justify-between items-center">
            <div>
              <h3 className="font-bold text-slate-800 text-sm">Procurement Requests (Grouped Multi-Item)</h3>
              <p className="text-xs text-slate-500">Multiple items remain together under one Request ID.</p>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={handleExportRequestsPDF} className="btn-secondary text-xs flex items-center gap-1.5 shadow-sm">
                📄 Export PDF
              </button>
              {role === 'storage' && (
                <button onClick={() => setIsCreating(true)} className="btn-primary text-xs">+ Create Grouped Request (Multi-Item)</button>
              )}
            </div>
          </div>

          <div className="card overflow-x-auto">
            <table className="min-w-full divide-y divide-slate-200 text-xs">
              <thead>
                <tr>
                  <th className="table-th">Request ID</th>
                  <th className="table-th">Requested Items (Grouped)</th>
                  <th className="table-th">Priority</th>
                  <th className="table-th">Status</th>
                  <th className="table-th">Date</th>
                  <th className="table-th">Actions</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {requests.length === 0 ? (
                  <tr>
                    <td colSpan={6} className="text-center py-10 text-slate-400">
                      <div className="text-3xl mb-2">ðŸ“‹</div>
                      <p className="font-semibold text-slate-700 text-sm">No procurement requests</p>
                      <p className="text-xs text-slate-400 mt-1">Request list is completely clean. Click "+ Create Grouped Request" to submit a requirement.</p>
                    </td>
                  </tr>
                ) : (
                  requests.map(r => {
                    const norm = normalizeItems(r);
                    return (
                      <tr key={r.id} className="hover:bg-slate-50">
                        <td className="table-td font-mono font-bold text-primary-700">
                          <button onClick={() => setViewingReq(r)} className="hover:underline text-left">
                            {r.id}
                          </button>
                        </td>
                        <td className="table-td">
                          <div className="inline-grid gap-x-3 gap-y-0.5 text-xs" style={{gridTemplateColumns: 'minmax(0,1fr) auto'}}>
                            {norm.map((it, idx) => (
                              <React.Fragment key={idx}>
                                <span className="font-medium text-slate-700 truncate">
                                  <span className="text-slate-400 mr-1">•</span>{it.itemName}
                                </span>
                                <span className="font-bold text-primary-700 text-right whitespace-nowrap">
                                  {it.requiredQty} {it.unit}
                                  {it.packSize && it.packSize !== 'Not Specified' && (
                                    <span className="text-slate-400 font-normal text-[10px] ml-1">({it.packSize})</span>
                                  )}
                                </span>
                              </React.Fragment>
                            ))}
                          </div>
                        </td>
                        <td className="table-td"><span className="badge bg-slate-100 text-slate-700">{r.priority}</span></td>
                        <td className="table-td"><StatusBadge status={r.status} /></td>
                        <td className="table-td text-slate-400">{r.requestDate}</td>
                        <td className="table-td">
                          <div className="flex gap-2 items-center">
                            <button onClick={() => setViewingReq(r)} className="btn-secondary text-xs py-1 px-2">
                              👁️ View
                            </button>
                            {role === 'procurement' && r.status === 'pending' && (
                              <button onClick={() => openPurchaseModal(r)} className="btn-primary text-xs py-1 px-2.5 shadow-sm">
                                🛒 Order Purchase
                              </button>
                            )}
                            <button 
                              onClick={() => setDeleteModalReq(r)} 
                              className="px-2 py-1 text-xs font-semibold text-rose-600 bg-rose-50 hover:bg-rose-100 hover:text-rose-700 border border-rose-200 rounded-md transition-colors inline-flex items-center gap-1"
                              title="Delete Request"
                            >
                              🗑️ Delete
                            </button>
                            {r.purchaseId && <span className="font-mono text-slate-500 font-medium">Order: {r.purchaseId}</span>}
                          </div>
                        </td>
                      </tr>
                    );
                  })
                )}
              </tbody>
            </table>
          </div>

          {/* New Grouped Request Modal */}
          {isCreating && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <form onSubmit={handleCreateGroupedReq} className="bg-white rounded-xl p-6 max-w-xl w-full space-y-4 shadow-2xl max-h-[90vh] flex flex-col">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-slate-800 text-sm">Create New Procurement Request (Multi-Item)</h3>
                  <span className="badge bg-primary-100 text-primary-800 font-mono">Storage Committee</span>
                </div>

                <div className="space-y-3 flex-1 overflow-y-auto pr-1">
                  <div className="flex justify-between items-center">
                    <label className="text-xs font-bold text-slate-700">Add Requested Items:</label>
                    <button type="button" onClick={handleAddReqRow} className="text-primary-600 hover:text-primary-700 text-xs font-bold">
                      + Add Item Row
                    </button>
                  </div>

                  {reqItems.map((row, idx) => {
                    const sel = items.find(i => i.id === row.itemId);
                    return (
                      <div key={idx} className="p-3 rounded-lg border border-slate-200 bg-slate-50 grid grid-cols-1 sm:grid-cols-6 gap-2 items-center">
                        <div className="sm:col-span-3">
                          <label className="text-[10px] text-slate-500 block">Item #{idx + 1} *</label>
                          <select 
                            value={row.itemId} 
                            onChange={e => handleReqRowChange(idx, 'itemId', e.target.value)} 
                            className="form-select text-xs" 
                            required
                          >
                            <option value="">Select pantry item...</option>
                            {items.map(i => (
                              <option key={i.id} value={i.id}>
                                {i.name} {i.brand && i.brand !== 'Not Specified' ? `(${i.brand})` : ''}
                              </option>
                            ))}
                          </select>
                        </div>
                        <div className="sm:col-span-2">
                          <label className="text-[10px] text-slate-500 block">Required Qty ({sel?.unit || 'unit'}) *</label>
                          <input 
                            type="number" 
                            step="0.01" 
                            value={row.requiredQty} 
                            onChange={e => handleReqRowChange(idx, 'requiredQty', e.target.value)} 
                            className="form-input text-xs font-bold" 
                            placeholder="Qty" 
                            required 
                          />
                        </div>
                        <div className="sm:col-span-1 pt-3 text-right">
                          {reqItems.length > 1 && (
                            <button type="button" onClick={() => handleRemoveReqRow(idx)} className="text-red-500 hover:text-red-700 text-xs font-bold">
                              ✕
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}

                  <div className="grid grid-cols-2 gap-3 pt-2">
                    <div>
                      <label className="form-label">Priority</label>
                      <select value={priority} onChange={e => setPriority(e.target.value)} className="form-select text-xs">
                        <option>Normal</option>
                        <option>Urgent</option>
                        <option>Critical</option>
                      </select>
                    </div>
                    <div>
                      <label className="form-label">Reason</label>
                      <input type="text" value={reason} onChange={e => setReason(e.target.value)} className="form-input text-xs" required />
                    </div>
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t">
                  <button type="button" onClick={() => setIsCreating(false)} className="btn-secondary text-xs">Cancel</button>
                  <button type="submit" className="btn-primary text-xs">Submit Grouped Request</button>
                </div>
              </form>
            </div>
          )}

          {/* Place Purchase Order Modal for Grouped Request */}
          {purchaseModalReq && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <form onSubmit={handleCreateGroupedPurchase} className="bg-white rounded-xl p-6 max-w-xl w-full space-y-4 shadow-2xl max-h-[90vh] flex flex-col">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-slate-800 text-sm">Place Purchase Order for {purchaseModalReq.id}</h3>
                  <span className="badge bg-primary-100 text-primary-800 font-mono">{purchaseModalReq.id}</span>
                </div>

                <div className="space-y-3 flex-1 overflow-y-auto pr-1">
                  <div>
                    <label className="form-label">Select Vendor / Supplier *</label>
                    <select value={vendorId} onChange={e => setVendorId(e.target.value)} className="form-select text-xs" required>
                      {vendors.map(v => <option key={v.id} value={v.id}>{v.name} ({v.contactPerson})</option>)}
                    </select>
                  </div>

                  <div className="border border-slate-200 rounded-xl p-3 bg-slate-50 space-y-2">
                    <p className="text-xs font-bold text-slate-700">Items in this Order:</p>
                    {purOrderItems.map((it, idx) => (
                      <div key={idx} className="bg-white p-2.5 rounded-lg border border-slate-200 flex items-center justify-between gap-3">
                        <div>
                          <p className="font-semibold text-slate-800 text-xs">{it.itemName}</p>
                          <p className="text-[10px] text-slate-400">Unit: {it.unit}</p>
                        </div>
                        <div className="flex items-center gap-2">
                          <label className="text-xs text-slate-500">Ordered Qty:</label>
                          <input 
                            type="number" 
                            step="0.01" 
                            value={it.orderedQty} 
                            onChange={e => {
                              const up = [...purOrderItems];
                              up[idx].orderedQty = e.target.value;
                              setPurOrderItems(up);
                            }} 
                            className="form-input text-xs font-bold w-24 py-1" 
                            required 
                          />
                          <span className="text-xs text-slate-500">{it.unit}</span>
                        </div>
                      </div>
                    ))}
                  </div>

                  <div>
                    <label className="form-label">Expected Delivery Date</label>
                    <input type="date" value={expectedDelivery} onChange={e => setExpectedDelivery(e.target.value)} className="form-input text-xs" />

    // --- BILLS VIEW (WITH VENDOR NAME IN LISTING, AUTOMATIC ORDERED ITEMS ON VENDOR SELECT, DELETE PERMISSION FOR ADMIN & ACCOUNT, & PRINT FOR ACCOUNTANT) ---
    function BillsView({ role, currentUser, onUpdate }) {
      const [bills, setBills] = useState(() => ls_get('bills', []));
      const [purchases] = useState(() => ls_get('purchases', []));
      const [vendors] = useState(() => ls_get('vendors', []));

      const [isUploading, setIsUploading] = useState(false);
      const [viewingBill, setViewingBill] = useState(null);
      const [deleteModalBill, setDeleteModalBill] = useState(null);

      // Google Drive Integration State — stored in Firebase so ALL devices share the same URL
      const [gdriveScriptUrl, setGdriveScriptUrl] = useState(() => ls_get('gdrive_script_url', '') || '');
      const [isConfiguringDrive, setIsConfiguringDrive] = useState(false);
      const [tempScriptUrl, setTempScriptUrl] = useState(gdriveScriptUrl);
      const [isSavingToDrive, setIsSavingToDrive] = useState(false);

      // Upload form state
      const [selectedVendorId, setSelectedVendorId] = useState('');
      const [billNo, setBillNo] = useState('');
      const [billAmt, setBillAmt] = useState('');
      const [fileBase64, setFileBase64] = useState(null);
      const [fileName, setFileName] = useState('');
      const [fileType, setFileType] = useState('');

      // Auto-extract items ordered from selected vendor
      const vendorOrderedItems = useMemo(() => {
        if (!selectedVendorId) return [];
        const vendorPurchases = purchases.filter(p => p.vendorId === selectedVendorId);
        const allItems = [];
        vendorPurchases.forEach(p => {
          const norm = normalizeItems(p);
          norm.forEach(it => {
            allItems.push({
              purchaseId: p.id,
              itemId: it.itemId,
              itemName: it.itemName,
              orderedQty: it.orderedQty,
              unit: it.unit
            });
          });
        });
        return allItems;
      }, [selectedVendorId, purchases]);

      const handleFilePick = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setFileName(file.name);
        setFileType(file.type);

        const reader = new FileReader();
        reader.onload = (ev) => {
          setFileBase64(ev.target.result);
          showToast(`File "${file.name}" selected!`, 'info');
        };
        reader.readAsDataURL(file);
      };

      const handleSaveDriveUrl = (e) => {
        e.preventDefault();
        const clean = tempScriptUrl.trim();
        // Save to Firebase-synced storage — ALL devices will auto-get this URL
        ls_set('gdrive_script_url', clean);
        setGdriveScriptUrl(clean);
        showToast('✅ Google Drive connected! All devices will now upload to your Drive automatically.', 'success');
        setIsConfiguringDrive(false);
      };

      const handleUploadBill = async (e) => {
        e.preventDefault();
        const selVendor = vendors.find(v => v.id === selectedVendorId);
        if (!selVendor) {
          showToast('Please select a vendor.', 'error');
          return;
        }

        const id = getNextId('BILL');
        let driveUrl = null;

        // Auto-save to Google Drive if configured
        if (gdriveScriptUrl && fileBase64) {
          try {
            setIsSavingToDrive(true);
            showToast('Uploading bill to your Google Drive...', 'info');
            const res = await fetch(gdriveScriptUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({
                fileName: fileName || `Bill_${billNo}.pdf`,
                fileData: fileBase64,
                vendorName: selVendor.name,
                billNumber: billNo,
                billAmount: billAmt,
                billDate: new Date().toISOString().slice(0, 10)
              })
            });
            const resData = await res.json();
            if (resData && resData.fileUrl) {
              driveUrl = resData.fileUrl;
              showToast('Saved to Google Drive folder!', 'success');
            }
          } catch(err) {
            console.warn('Google Drive note:', err);
          } finally {
            setIsSavingToDrive(false);
          }
        }

        const newBill = {
          id,
          vendorId: selVendor.id,
          vendorName: selVendor.name,
          items: vendorOrderedItems,
          billNumber: billNo,
          billAmount: Number(billAmt),
          fileData: fileBase64,
          fileName: fileName || 'Uploaded_Invoice',
          fileType: fileType,
          driveUrl: driveUrl,
          billDate: new Date().toISOString().slice(0, 10),
          verificationStatus: 'pending_verification',
          paymentStatus: 'pending',
          createdBy: currentUser.name,
          createdAt: new Date().toISOString()
        };

        const updated = [...bills, newBill];
        ls_set('bills', updated);
        setBills(updated);
        logActivity('Uploaded Bill & Invoice', 'PROCUREMENT', `${id} (Inv: ${billNo})`, `Vendor: ${selVendor.name}, Amount: ₹${Number(billAmt).toLocaleString()}`);
        showToast(`Bill ${id} with vendor ${selVendor.name} uploaded!`, 'success');
        setIsUploading(false);
        setSelectedVendorId('');
        setBillNo('');
        setBillAmt('');
        setFileBase64(null);
        setFileName('');
        onUpdate();
      };

      // Verification & Forwarding (Account Committee)
      const handleVerifyAndForward = (billId) => {
        const updated = bills.map(b => b.id === billId ? { ...b, verificationStatus: 'verified' } : b);
        ls_set('bills', updated);
        setBills(updated);
        logActivity('Verified & Forwarded Bill', 'ACCOUNT', billId, 'Account Committee verified bill and approved for Super Admin payment disbursement');
        showToast(`Bill ${billId} Verified & Marked Approved for Payment!`, 'success');
        onUpdate();
      };

      const handleReject = (billId) => {
        const updated = bills.map(b => b.id === billId ? { ...b, verificationStatus: 'rejected' } : b);
        ls_set('bills', updated);
        setBills(updated);
        logActivity('Rejected Bill', 'ACCOUNT', billId, 'Account Committee rejected bill verification');
        showToast(`Bill ${billId} was Marked Rejected.`, 'error');
        onUpdate();
      };

      // Bill Delete Permission (Admin and Account can both delete bills -> MOVES TO TRASH)
      const handleConfirmDeleteBill = () => {
        if (!deleteModalBill) return;
        moveToTrash('bills', deleteModalBill, `Bill No: ${deleteModalBill.billNumber} (₹${Number(deleteModalBill.billAmount || 0).toLocaleString()}) - ${deleteModalBill.vendorName || 'Vendor'}`);
        const updated = bills.filter(b => b.id !== deleteModalBill.id);
        ls_set('bills', updated);
        setBills(updated);
        showToast(`Bill ${deleteModalBill.id} (${deleteModalBill.billNumber}) moved to Trash Bin! (Super Admin can restore it anytime)`, 'error');
        setDeleteModalBill(null);
        onUpdate();
      };

      // Print Bill Voucher (Both Admin and Accountant can Print)
      const triggerPrint = () => {
        window.print();
      };

      return (
        <div className="space-y-4">
          <div className="flex flex-wrap justify-between items-center gap-3 no-print">
            <div>
              <h3 className="font-bold text-slate-800 text-sm">Bills & Supplier Invoices</h3>
              <p className="text-xs text-slate-500">Upload invoices with auto-linked vendor items, Google Drive backup, verify bills, print vouchers, or delete records.</p>
            </div>
            <div className="flex flex-wrap gap-2">
              <button 
                onClick={() => { setTempScriptUrl(gdriveScriptUrl); setIsConfiguringDrive(true); }} 
                className="btn-secondary text-xs flex items-center gap-1.5"
                title="Connect Google Drive to save bills in personal Google Drive"
              >
                <span>📁</span>
                <span>{gdriveScriptUrl ? '🟢 Google Drive Connected' : '⚙️ Connect Google Drive'}</span>
              </button>
              {(role === 'procurement' || role === 'admin') && (
                <button onClick={() => setIsUploading(true)} className="btn-primary text-xs">📁 Upload New Bill</button>
              )}
            </div>
          </div>

          <div className="card overflow-x-auto no-print">
            <table className="min-w-full divide-y divide-slate-200 text-xs">
              <thead>
                <tr>
                  <th className="table-th">Bill ID</th>
                  <th className="table-th">Vendor Name</th>
                  <th className="table-th">Ordered Items</th>
                  <th className="table-th">Bill Number</th>
                  <th className="table-th">Amount</th>
                  <th className="table-th">Document / File</th>
                  <th className="table-th">Status</th>
                  <th className="table-th">Actions</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {bills.length === 0 ? (
                  <tr><td colSpan={8} className="text-center py-6 text-slate-400">No bills uploaded yet.</td></tr>
                ) : (
                  bills.map(b => {
                    const normItems = normalizeItems(b);
                    return (
                      <tr key={b.id} className="hover:bg-slate-50">
                        <td className="table-td font-mono font-bold text-indigo-700">{b.id}</td>
                        {/* Clear Vendor Name Display */}
                        <td className="table-td font-bold text-slate-900">{b.vendorName || 'General Supplier'}</td>
                        <td className="table-td">
                          <div className="space-y-1">
                            {normItems.map((it, idx) => (
                              <div key={idx} className="text-slate-700">
                                • {it.itemName} ({it.orderedQty || it.qty} {it.unit})
                              </div>
                            ))}
                          </div>
                        </td>

    // --- PAYMENTS VIEW (ADMIN-ONLY DISBURSAL, PERMISSION REMOVED FROM ACCOUNTANT) ---
    function PaymentsView({ role, currentUser, onUpdate }) {
      const [bills, setBills] = useState(() => ls_get('bills', []));
      const [payments, setPayments] = useState(() => ls_get('payments', []));
      const [payModalBill, setPayModalBill] = useState(null);
      const [amount, setAmount] = useState('');
      const [mode, setMode] = useState('UPI');
      const [refNo, setRefNo] = useState('');

      const handlePay = (e) => {
        e.preventDefault();
        const payId = getNextId('PAY');
        const payNum = Number(amount);

        const newPay = {
          id: payId,
          billId: payModalBill.id,
          purchaseId: payModalBill.purchaseId || 'PUR-GRP',
          vendorId: payModalBill.vendorId,
          vendorName: payModalBill.vendorName,
          amount: payNum,
          paymentDate: new Date().toISOString().slice(0, 10),
          paymentMode: mode,
          referenceNumber: refNo,
          paidBy: currentUser.name,
          createdAt: new Date().toISOString()
        };

        const updatedPayments = [...payments, newPay];
        ls_set('payments', updatedPayments);
        setPayments(updatedPayments);

        const totalPaidSoFar = updatedPayments.filter(p => p.billId === payModalBill.id).reduce((s, p) => s + Number(p.amount), 0);
        const rem = Number(payModalBill.billAmount) - totalPaidSoFar;
        const newStatus = rem <= 0 ? 'paid' : 'partially_paid';

        const updatedBills = bills.map(b => b.id === payModalBill.id ? { ...b, paymentStatus: newStatus } : b);
        ls_set('bills', updatedBills);
        setBills(updatedBills);

        showToast(`Payment ${payId} of ₹${payNum.toLocaleString()} processed!`, 'success');
        setPayModalBill(null);
        setAmount('');
        onUpdate();
      };

      return (
        <div className="space-y-4">
          <div className="flex justify-between items-center">
            <div>
              <h3 className="font-bold text-slate-800 text-sm">Disburse Vendor Payments (Super Admin Disbursal)</h3>
              <p className="text-xs text-slate-500">Pay verified invoices and record bank/UPI transaction references.</p>
            </div>
          </div>

          <div className="card overflow-x-auto">
            <table className="min-w-full divide-y divide-slate-200 text-xs">
              <thead>
                <tr>
                  <th className="table-th">Bill ID</th>
                  <th className="table-th">Vendor</th>
                  <th className="table-th">Bill Total</th>
                  <th className="table-th">Already Paid</th>
                  <th className="table-th">Remaining</th>
                  <th className="table-th">Verification</th>
                  <th className="table-th">Status</th>
                  <th className="table-th">Action</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {bills.map(b => {
                  const paid = payments.filter(p => p.billId === b.id).reduce((s, p) => s + Number(p.amount), 0);
                  const rem = Math.max(0, Number(b.billAmount) - paid);
                  return (
                    <tr key={b.id} className="hover:bg-slate-50">
                      <td className="table-td font-mono font-bold text-indigo-700">{b.id}</td>
                      <td className="table-td font-semibold text-slate-800">{b.vendorName || 'General Supplier'}</td>
                      <td className="table-td font-semibold">₹{Number(b.billAmount).toLocaleString()}</td>
                      <td className="table-td font-bold text-emerald-600">₹{paid.toLocaleString()}</td>
                      <td className="table-td font-bold text-red-600">₹{rem.toLocaleString()}</td>
                      <td className="table-td"><StatusBadge status={b.verificationStatus} /></td>
                      <td className="table-td"><StatusBadge status={rem <= 0 ? 'paid' : paid > 0 ? 'partially_paid' : 'pending'} /></td>
                      <td className="table-td">
                        {role === 'admin' && rem > 0 && (
                          <button onClick={() => { setPayModalBill(b); setAmount(rem); }} className="btn-primary text-xs py-1 px-2.5">
                            💳 Pay ₹{rem.toLocaleString()}
                          </button>
                        )}
                        {role !== 'admin' && rem > 0 && (
                          <span className="text-slate-400 italic text-[11px]">Admin Disbursal</span>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          {payModalBill && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <form onSubmit={handlePay} className="bg-white rounded-xl p-6 max-w-md w-full space-y-3 shadow-2xl">
                <h3 className="font-bold text-slate-800 text-sm">Process Payment for {payModalBill.id}</h3>
                <div>
                  <label className="form-label">Payment Amount (₹) *</label>
                  <input type="number" step="0.01" value={amount} onChange={e => setAmount(e.target.value)} className="form-input" required />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="form-label">Mode</label>
                    <select value={mode} onChange={e => setMode(e.target.value)} className="form-select">
                      {['UPI', 'NEFT', 'RTGS', 'Cash', 'Cheque', 'DD'].map(m => <option key={m}>{m}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="form-label">Reference No.</label>
                    <input type="text" value={refNo} onChange={e => setRefNo(e.target.value)} className="form-input font-mono" placeholder="UTR/Cheque No" />
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setPayModalBill(null)} className="btn-secondary text-xs">Cancel</button>
                  <button type="submit" className="btn-success text-xs">Confirm Payment</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

      return (
        <div className="space-y-4">

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

              const vBills = bills.filter(b => b.vendorId === v.id);

              const vPays = payments.filter(p => p.vendorId === v.id || vBills.some(b => b.id === p.billId));

              return (
                <div key={v.id} className="card p-5 space-y-3">
                  <div className="flex justify-between items-start">
                    <div>
                      <h4 className="font-bold text-slate-900">{v.name}</h4>

    function TraceView() {
      const requests = ls_get('requests', []);

              const b = p ? bills.find(x => x.purchaseId === p.id || (x.items && x.items.some(it => it.purchaseId === p.id))) : null;

    // --- ADMIN-ONLY APPROVALS VIEW (STOCK OUT EXCEEDED UPPER LIMIT) ---
    function AdminApprovalsView({ currentUser, onUpdate }) {
      const [stockOuts, setStockOuts] = useState(() => ls_get('stockOuts', []));
      const [items, setItems] = useState(() => ls_get('items', []));
      const [rejectModal, setRejectModal] = useState(null);
      const [rejectReason, setRejectReason] = useState('');

      const pendingList = stockOuts.filter(s => s.status === 'pending_approval' || s.requiresAdminApproval);

      const handleApprove = (so) => {
        const soItems = normalizeItems(so);
        let currentItems = [...items];

        // Validate stock availability
        for (let it of soItems) {
          const itemObj = currentItems.find(i => i.id === it.itemId);
          if (!itemObj || itemObj.currentStock < Number(it.qty)) {
            showToast(`Cannot approve: ${it.itemName} has only ${itemObj ? itemObj.currentStock : 0} ${it.unit} in stock!`, 'error');
            return;
          }
        }

        // Deduct from stock
        soItems.forEach(it => {
          currentItems = currentItems.map(i => i.id === it.itemId ? { ...i, currentStock: i.currentStock - Number(it.qty) } : i);
        });
        ls_set('items', currentItems);
        setItems(currentItems);

        // Update Stock Out record
        const now = new Date();
        const updatedStockOuts = stockOuts.map(s => s.id === so.id ? {
          ...s,
          status: 'approved',
          requiresAdminApproval: false,
          approvedBy: currentUser.name,
          approvedAt: now.toISOString(),
          approvalDate: now.toISOString().slice(0, 10),
          approvalTime: now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true })
        } : s);
        ls_set('stockOuts', updatedStockOuts);
        setStockOuts(updatedStockOuts);

        logActivity('Approved Stock Out (Exceeded Limit)', 'ADMIN', so.id, `Admin ${currentUser.name} approved issue of ${soItems.map(i => `${i.itemName} (${i.qty} ${i.unit})`).join(', ')}`);
        showToast(`Stock Out ${so.id} approved! Quantities deducted from store.`, 'success');
        onUpdate();
      };

      const handleReject = (e) => {
        e.preventDefault();
        if (!rejectModal) return;
        const now = new Date();
        const updatedStockOuts = stockOuts.map(s => s.id === rejectModal.id ? {
          ...s,
          status: 'rejected',
          requiresAdminApproval: false,
          rejectedBy: currentUser.name,
          adminRemark: rejectReason || 'Rejected by Super Admin',
          rejectedAt: now.toISOString(),
          rejectedDate: now.toISOString().slice(0, 10),
          rejectedTime: now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true })
        } : s);
        ls_set('stockOuts', updatedStockOuts);
        setStockOuts(updatedStockOuts);

        logActivity('Rejected Stock Out', 'ADMIN', rejectModal.id, `Admin ${currentUser.name} rejected Stock Out. Reason: ${rejectReason || 'No remark'}`);
        showToast(`Stock Out ${rejectModal.id} was rejected.`, 'error');
        setRejectModal(null);
        setRejectReason('');
        onUpdate();
      };

      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-amber-600 to-orange-700 rounded-2xl p-6 text-white shadow-lg flex flex-wrap justify-between items-center gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="text-2xl">🛡️</span>
                <h2 className="text-xl font-bold">Stock Out Approval Management</h2>
              </div>
              <p className="text-amber-100 text-xs mt-1">Review and approve or reject material issues that exceed the configured Upper Limits.</p>
            </div>
            <div className="bg-white/20 backdrop-blur px-4 py-2 rounded-xl text-center">
              <p className="text-xs uppercase font-semibold text-amber-100">Pending Approvals</p>
              <p className="text-2xl font-black">{pendingList.length}</p>
            </div>
          </div>

          <div className="card overflow-hidden">
            <div className="p-4 border-b border-slate-100 flex justify-between items-center">

    // --- ADMIN-ONLY TRASH BIN VIEW (SOFT-DELETE & RESTORE) ---
    function TrashView({ currentUser, onUpdate }) {
      const [trash, setTrash] = useState(() => ls_get('trash', []));
      const [search, setSearch] = useState('');
      const [collectionFilter, setCollectionFilter] = useState('ALL');
      const [viewPayload, setViewPayload] = useState(null);
      const [showEmptyConfirm, setShowEmptyConfirm] = useState(false);

      const filteredTrash = trash.filter(t => {
        const q = search.toLowerCase();
        const matchesSearch = !search || 
          t.title?.toLowerCase().includes(q) || 
          t.originalId?.toLowerCase().includes(q) || 
          t.deletedBy?.toLowerCase().includes(q) || 
          t.originalCollection?.toLowerCase().includes(q);
        const matchesCollection = collectionFilter === 'ALL' || t.originalCollection === collectionFilter;
        return matchesSearch && matchesCollection;
      });

      const handleRestore = (trashId) => {
        const item = trash.find(t => t.id === trashId);
        const ok = restoreFromTrash(trashId);
        if (ok) {
          const updated = trash.filter(t => t.id !== trashId);
          setTrash(updated);
          showToast(`"${item?.title || 'Record'}" restored successfully to active database!`, 'success');
          onUpdate();
        } else {
          showToast('Failed to restore item.', 'error');
        }
      };

      const handlePermanentDelete = (trashId) => {
        const item = trash.find(t => t.id === trashId);
        if (!confirm(`Permanently delete "${item?.title || 'this item'}"? It CANNOT be recovered!`)) return;
        deleteFromTrashPermanently(trashId);
        const updated = trash.filter(t => t.id !== trashId);
        setTrash(updated);
        showToast('Record permanently purged from Trash.', 'error');
        onUpdate();
      };

      const handleEmptyTrash = () => {
        emptyTrash();
        setTrash([]);
        showToast('Trash Bin emptied completely!', 'info');
        setShowEmptyConfirm(false);
        onUpdate();
      };

      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-red-700 to-rose-900 rounded-2xl p-6 text-white shadow-lg flex flex-wrap justify-between items-center gap-4">
            <div>
              <div className="flex items-center gap-2">

                <h2 className="text-xl font-bold">Super Admin Trash Bin</h2>
                <span className="badge bg-red-500/30 text-red-200 border border-red-400/30 text-[10px]">Admin Only</span>
              </div>
              <p className="text-rose-100 text-xs mt-1">Deleted bills, stock items, vendors, members, and requests are safely stored here. You can Restore or Permanently Delete them.</p>
            </div>
            <div>
              {trash.length > 0 && (
                <button onClick={() => setShowEmptyConfirm(true)} className="btn-danger bg-white text-red-800 hover:bg-rose-50 text-xs font-semibold shadow-md">
                  🗑️ Empty Entire Trash ({trash.length})
                </button>
              )}
            </div>
          </div>

          <div className="card p-4 flex flex-wrap justify-between items-center gap-3">

      { key: 'market_research', label: 'Market Research', icon: '🔍', desc: 'Research market rates & requirements' },
      { key: 'rfq_sent', label: 'RFQ Sent', icon: '📤', desc: 'Request for Quotation sent to vendors' },
      { key: 'quotations_received', label: 'Quotations Received', icon: '📨', desc: 'Vendor quotations collected' },
      { key: 'comparative_done', label: 'Comparative Statement', icon: '📊', desc: 'Rates compared across vendors' },
      { key: 'vendor_selected', label: 'Vendor Selected', icon: '✅', desc: 'Best vendor chosen' },

      { key: 'contract_signed', label: 'Contract Signed', icon: '📝', desc: '3-month contract executed' },
      { key: 'procurement_completed', label: 'Completed', icon: '🎉', desc: 'Procurement process complete' },

    const PROC_STEP_ORDER = PROC_STEPS.map(s => s.key);

    function procStepIndex(status) {
      const idx = PROC_STEP_ORDER.indexOf(status);
      return idx < 0 ? 0 : idx;
    }

      const filtered = procurements.filter(p => {
        const q = search.toLowerCase();
        const ms = p.title?.toLowerCase().includes(q) || p.id?.toLowerCase().includes(q) || p.createdBy?.toLowerCase().includes(q);
        const mstat = statusFilter === 'ALL' || p.status === statusFilter;
        return ms && mstat;
      });

      const handleAddItemRow = () => setNewProc(prev => ({ ...prev, items: [...prev.items, { itemName: '', unit: 'kg', estimatedQty: '' }] }));
      const handleRemoveItemRow = (i) => setNewProc(prev => ({ ...prev, items: prev.items.filter((_, idx) => idx !== i) }));

      const handleCreateProc = (e) => {
        e.preventDefault();
        const id = getNextId('PROC');
        const now = new Date();
        const proc = {
          id,
          title: newProc.title,
          description: newProc.description,
          items: newProc.items.filter(it => it.itemName.trim()),
          createdBy: currentUser.name,
          createdAt: now.toISOString(),
          date: now.toISOString().slice(0, 10),
          status: 'market_research',
          // All stage data initialized empty
          marketResearchNotes: '', marketResearchDate: '',
          rfqSentTo: [], rfqDate: '', rfqNotes: '', rfqDocBase64: '', rfqDocName: '',
          quotations: [],
          comparativeNotes: '', lowestVendorId: '',
          selectedVendorId: '', selectedVendorName: '', selectionReason: '', selectionDate: '',
          negotiationNotes: '', finalNegotiatedAmount: '', negotiationDate: '',
          contractNumber: '', contractStartDate: '', contractEndDate: '', contractTerms: '', contractDocBase64: '', contractDocName: '',
          completedDate: '', completionNotes: '',
          linkedPurchaseIds: [],
          history: [{ stage: 'market_research', by: currentUser.name, at: now.toISOString(), note: 'Procurement created' }]
        };
        const updated = [proc, ...procurements];
        ls_set('procurements', updated);
        setProcurements(updated);
        logActivity('Created Procurement', 'PROCUREMENT', `${id} — ${proc.title}`, `Created by ${currentUser.name}`);
        showToast(`Procurement ${id} created successfully!`, 'success');
        setShowNewModal(false);
        setNewProc({ title: '', description: '', items: [{ itemName: '', unit: 'kg', estimatedQty: '' }] });
        onUpdate();
      };

      const stats = {
        total: procurements.length,
        active: procurements.filter(p => !['procurement_completed','cancelled'].includes(p.status)).length,
        completed: procurements.filter(p => p.status === 'procurement_completed').length,
        pending: procurements.filter(p => p.status === 'market_research' || p.status === 'rfq_sent').length,
      };

      return (
        <div className="space-y-6">
          {/* Header Banner */}
          <div className="bg-gradient-to-r from-violet-700 to-indigo-800 rounded-2xl p-6 text-white shadow-lg flex flex-wrap justify-between items-center gap-4">
            <div>
              <div className="flex items-center gap-2.5">
                <span className="text-2xl">🔄</span>
                <h2 className="text-xl font-bold">Procurement Workflow</h2>
              </div>
              <p className="text-violet-200 text-xs mt-1">End-to-end procurement: Market Research → RFQ → Quotations → Vendor Selection → Contract → Completion</p>
            </div>
            <button onClick={() => setShowNewModal(true)} className="btn-primary bg-white text-violet-800 hover:bg-violet-50 font-bold shadow-lg">
              + New Procurement
            </button>
          </div>

          {/* Stats */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <StatCard title="Total Procurements" value={stats.total} icon="📋" color="blue" />
            <StatCard title="Active / In Progress" value={stats.active} icon="🔄" color="amber" subtitle="Ongoing workflows" />
            <StatCard title="Completed" value={stats.completed} icon="🎉" color="green" />
            <StatCard title="Early Stage" value={stats.pending} icon="🔍" color="indigo" subtitle="Research / RFQ stage" />

          {/* Filters */}
          <div className="card p-4 flex flex-wrap gap-3 items-center justify-between">
            <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="Search by title, ID, created by..." className="form-input max-w-xs text-xs" />

              {PROC_STEPS.map(s => <option key={s.key} value={s.key}>{s.icon} {s.label}</option>)}

            </select>

          {/* Procurement Table */}
          <div className="card overflow-hidden">
            <div className="p-4 border-b border-slate-100 flex justify-between items-center">

            <div className="overflow-x-auto">
